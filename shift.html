// รวมค่าจากหัตถการ/ป4p ของเดือนหนึ่ง เพื่อเติมแถวตัวหารที่ความหมายตรงกัน
function rmAuto(yearBE, m, back){
  const yCE = (back ? yearBE - 1 : yearBE) - 543;
  let blood = 0, vent = 0, bedDays = 0;
  Object.keys(allDays).forEach(key=>{
    const [yy,mm] = key.split("-").map(Number);
    if(yy !== yCE || mm !== m) return;
    const rec = allDays[key];
    SHIFTS.forEach(sh=>{
      const n = path=>{ const v = parseFloat(getDeep(rec.shifts[sh], path)); return isNaN(v) ? 0 : v; };
      blood   += n("proc.p51") + n("proc.p52") + n("proc.p53");   // PRC/PC/FFP
      vent    += n("proc.p1");                                     // On Volume respirator
      bedDays += n("p4pd.bedDays");                                // จำนวนวันนอน
    });
  });
  return { blood, vent, bedDays };
}

// ชีทรายละเอียด: 1 แถว = 1 อุบัติการณ์ ตลอดปีงบ
function buildRmDetailSheet(yearBE){
  const rows = [["วันที่","เวร","หมวด","รายการย่อย","ระดับ","เตียง","HN","รายละเอียดเหตุการณ์","การจัดการ/แก้ไข","Incharge"]];
  const keys = Object.keys(allDays).filter(k=>{
    const [yy,mm] = k.split("-").map(Number);
    const beg = (yearBE - 1) - 543;   // ต.ค.–ธ.ค. ของปีก่อน
    const end = yearBE - 543;         // ม.ค.–ก.ย. ของปีงบ
    return (yy === beg && mm >= 10) || (yy === end && mm <= 9);
  }).sort();

  keys.forEach(k=>{
    const [yy,mm,dd] = k.split("-").map(Number);
    const thaiDate = `${dd}/${mm}/${yy+543}`;
    SHIFTS.forEach(sh=>{
      const arr = getDeep(allDays[k].shifts[sh], "events.incidents");
      if(!Array.isArray(arr)) return;
      arr.forEach(it=>{
        if(!it || (!it.group && !it.detail)) return;
        rows.push([thaiDate, sh, it.group||"", it.item||"", it.sev||"",
                   it.bed||"", it.hn||"", it.detail||"", it.action||"",
                   getDeep(allDays[k].shifts[sh], "incharge") || ""]);
      });
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:11},{wch:7},{wch:30},{wch:32},{wch:7},{wch:7},{wch:11},{wch:40},{wch:32},{wch:20}];
  ws["!freeze"] = {ySplit:1};
  for(let col=0; col<=9; col++){
    styleCell(ws, XLSX.utils.encode_cell({r:0,c:col}),
      {font:{bold:true,color:{rgb:"0D3B8C"}},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center"}});
  }
  for(let r=1; r<rows.length; r++){
    const high = SEV_HIGH.includes(rows[r][4]);
    for(let col=0; col<=9; col++){
      styleCell(ws, XLSX.utils.encode_cell({r,c:col}),
        Object.assign({alignment:{horizontal:(col>=7?"left":"center"),wrapText:true}},
                      high ? {fill:{fgColor:{rgb:"FDECEA"}}} : {}));
    }
  }
  return ws;
}

function exportRM(){
  const btn = document.getElementById("btn-export-rm");
  const lab = btn.querySelector("span:last-child");
  const orig = lab.innerHTML;
  lab.innerHTML = "⏳ กำลังสร้างไฟล์...";
  btn.disabled = true;
  try{
    saveStore();
    const yearBE = parseInt(document.getElementById("rm-year").value) || 2569;
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, buildRmDashboard(yearBE), "Dashboard");

    const yearTotal = {};
    const yearAuto = { blood:0, vent:0, bedDays:0 };
    let yearInc = [];
    RM_MONTHS.forEach(mo=>{
      const counts = rmCount(yearBE, mo.m, mo.back);
      const auto = rmAuto(yearBE, mo.m, mo.back);
      const monthInc = rmMonthIncidents(yearBE, mo.m, mo.back);
      yearInc = yearInc.concat(monthInc);
      yearAuto.blood += auto.blood; yearAuto.vent += auto.vent; yearAuto.bedDays += auto.bedDays;
      // สะสมเข้ารวมปี
      Object.keys(counts).forEach(k=>{
        if(!yearTotal[k]) yearTotal[k] = {};
        RM_LEVELS.forEach(L=>{
          if(counts[k][L]) yearTotal[k][L] = (yearTotal[k][L] || 0) + counts[k][L];
        });
      });
      const yShown = (mo.back ? yearBE - 1 : yearBE);
      const title = `รายงานอุบัติการณ์ เดือน ${mo.name}  ${yShown}  กลุ่มภารกิจด้านการพยาบาลปี  ${yearBE}`;
      XLSX.utils.book_append_sheet(wb, buildRmSheet(title, counts, auto, monthInc), mo.sheet);
    });

    XLSX.utils.book_append_sheet(wb,
      buildRmSheet(`รายงานอุบัติการณ์ รวมทั้งปี  กลุ่มภารกิจด้านการพยาบาลปี  ${yearBE}`, yearTotal, yearAuto, yearInc), "รวมปี");

    XLSX.utils.book_append_sheet(wb, buildRmDetailSheet(yearBE), "รายละเอียด");

    XLSX.writeFile(wb, `RM_${yearBE}_RCU1.xlsx`);
  }catch(err){
    showPopup("สร้างไฟล์ RM ไม่สำเร็จ\n" + (err.message || err));
  }finally{
    lab.innerHTML = orig;
    btn.disabled = false;
  }
}
document.getElementById("btn-export-rm").addEventListener("click", exportRM);

function icSpecimenName(x){
  if(!x.specimen) return "";
  const extra = [x.specSite, x.specDetail].filter(v=>v && String(v).trim() && v !== "อื่นๆ").join(" ");
  return extra ? `${x.specimen} (${extra})` : x.specimen;
}
function icOrganismName(x){
  return (x.organism === "อื่นๆ" && x.organismOther) ? x.organismOther : (x.organism || "");
}
// เคสที่ "ผลเพาะเชื้อ" ตกอยู่ในเดือนที่กำหนด
function icCasesOfMonth(yCE, m){
  return icAll().filter(x=>{
    const d = x.foundDate || x.createdDate;
    if(!d) return false;
    const [yy,mm] = d.split("-").map(Number);
    return yy === yCE && mm === m;
  }).sort((a,b)=>(a.foundDate||"").localeCompare(b.foundDate||""));
}

               x.name || (p && p.name) || "", icOrganismName(x), icSpecimenName(x),
               x.labDate ? thaiShort(x.labDate) : "",
               x.admitFrom || (p && p.admitFrom) || "", x.diagnosis || (p && p.diagnosis) || "",

                   {s:{r:sumTitleRow,c:0}, e:{r:sumTitleRow,c:LAST}}];
  styleCell(ws,"A1",{font:{bold:true,sz:13,color:{rgb:"0D3B8C"}},alignment:{horizontal:"center"}});
  for(let col=0; col<=LAST; col++){
    styleCell(ws, XLSX.utils.encode_cell({r:headRow,c:col}),
      {font:{bold:true,color:{rgb:"0D3B8C"}},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center",wrapText:true}});
  }
  for(let r=headRow+1; r<headRow+1+Math.max(cases.length,1); r++){
    for(let col=0; col<=LAST; col++){
      styleCell(ws, XLSX.utils.encode_cell({r,c:col}),
        {alignment:{horizontal:(col===3||col===8||col===10)?"left":"center",wrapText:true}});
    }
  }
  styleCell(ws, XLSX.utils.encode_cell({r:sumTitleRow,c:0}),
    {font:{bold:true,sz:12,color:{rgb:"082A66"}},fill:{fgColor:{rgb:"DDE6F7"}}});
  for(let col=0; col<=1+IC_SPECIMENS.length; col++){
    styleCell(ws, XLSX.utils.encode_cell({r:sumHeadRow,c:col}),
      {font:{bold:true,color:{rgb:"0D3B8C"}},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center"}});
  }
  for(let r=sumStart; r<=sumEnd; r++){
    const isTotal = (r === sumEnd);
    for(let col=0; col<=1+IC_SPECIMENS.length; col++){
      styleCell(ws, XLSX.utils.encode_cell({r,c:col}),
        Object.assign({alignment:{horizontal:col===0?"left":"center"}},
          isTotal ? {font:{bold:true},fill:{fgColor:{rgb:"FFF4E0"}}} : {}));
    }
  }
  return ws;
}

async function exportIC(){
  const btn = document.getElementById("btn-export-ic");
  const lab = btn.querySelector("span:last-child");
  const orig = lab.innerHTML;
  lab.innerHTML = "⏳ กำลังสร้างไฟล์...";
  btn.disabled = true;
  try{
    await loadRegistry();                       // ให้ชื่อ/รับจาก/Dx ครบก่อนเขียนไฟล์
    const wb = XLSX.utils.book_new();
    if(icExportMode === "month"){
      const v = document.getElementById("ic-month").value;
      if(!v){ showPopup("กรุณาเลือกเดือนก่อน Export"); return; }
      const [y,m] = v.split("-").map(Number);
      XLSX.utils.book_append_sheet(wb,
        buildIcSheet(`รายงานเชื้อดื้อยา IC — ${THAI_MONTHS_FULL[m]} ${y+543}`, icCasesOfMonth(y,m)),
        `${THAI_MONTHS[m]}${String(y+543).slice(-2)}`);
      XLSX.writeFile(wb, `IC_${v}.xlsx`);
    } else {
      const yearBE = parseInt(document.getElementById("ic-year").value);
      let all = [];
      RM_MONTHS.forEach(mo=>{
        const yCE = (mo.back ? yearBE - 1 : yearBE) - 543;
        const cs = icCasesOfMonth(yCE, mo.m);
        all = all.concat(cs);
        const yShown = mo.back ? yearBE - 1 : yearBE;
        XLSX.utils.book_append_sheet(wb,
          buildIcSheet(`รายงานเชื้อดื้อยา IC — ${mo.name} ${yShown}`, cs), mo.sheet);
      });
      XLSX.utils.book_append_sheet(wb,
        buildIcSheet(`รายงานเชื้อดื้อยา IC — รวมทั้งปีงบ ${yearBE}`, all), "รวมปี");
      XLSX.writeFile(wb, `IC_${yearBE}.xlsx`);
    }
  }catch(err){
    showPopup("สร้างไฟล์ IC ไม่สำเร็จ\n" + (err.message || err));
  }finally{
    lab.innerHTML = orig;
    btn.disabled = false;
  }
}
document.getElementById("btn-export-ic").addEventListener("click", exportIC);

document.getElementById("btn-export-hattakan").addEventListener("click", ()=>{
  exportMode === "month" ? exportHattakanMonths() : exportHattakanDay();
});
document.getElementById("btn-export-p4pdaily").addEventListener("click", ()=>{
  exportMode === "month" ? exportP4pMonths() : exportP4pDay();
});
document.getElementById("btn-export-pdf").addEventListener("click", exportPdfRange);
</script>
