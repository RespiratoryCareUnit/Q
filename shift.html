<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0154ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RCU1">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RCU บันทึกเวร — ตัวอย่าง</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --navy:#0d3b8c; --navy-deep:#082a66; --sky:#d1e1fb; --paper:#f7f5ef;
    --ink:#0e121a; --line:#b1bfdf; --amber:#c47a1f; --ok:#1f7a4d; --danger:#b9432f;
    --shift-night:#3a4a8f; --shift-morn:#c47a1f; --shift-aft:#1f7a4d;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;background:var(--paper);color:var(--ink);}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-deep));color:#ffffff;padding:18px 16px 14px;}
  header h1{margin:0;font-size:1.15rem;font-weight:700;}
  header p{margin:4px 0 0;font-size:.78rem;opacity:.85;}
  a.back{color:#9fc1ff;font-size:.75rem;text-decoration:none;}

  .toprow{display:flex;gap:8px;padding:12px 16px;background:#ffffff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;}
  .toprow label{font-size:.75rem;color:#2a2a2a;display:block;margin-bottom:2px;}
  .toprow input[type=date]{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;}
  .shift-picker{display:flex;gap:6px;}
  .shift-btn{border:1.5px solid var(--line);background:#ffffff;border-radius:8px;padding:7px 12px;font-size:.82rem;cursor:pointer;font-weight:600;color:#2a2a2a;}
  .shift-btn[data-shift="ดึก"].active{background:var(--shift-night);color:#ffffff;border-color:var(--shift-night);}
  .shift-btn[data-shift="เช้า"].active{background:var(--shift-morn);color:#ffffff;border-color:var(--shift-morn);}
  .shift-btn[data-shift="บ่าย"].active{background:var(--shift-aft);color:#ffffff;border-color:var(--shift-aft);}

  nav.tabs{display:flex;overflow-x:auto;background:#ffffff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5;-webkit-overflow-scrolling:touch;}
  nav.tabs button{flex:0 0 auto;padding:11px 14px;background:none;border:none;font-size:.8rem;font-weight:600;color:#3d424c;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--navy);border-bottom-color:var(--navy);}

  main{padding:14px 16px 28px;max-width:720px;margin:0 auto;}
  section.panel{display:none;}
  section.panel.active{display:block;}

  .card{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 10px;font-size:.88rem;color:var(--navy-deep);border-left:4px solid var(--navy);padding-left:8px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .field{margin-bottom:8px;}
  .field label{display:block;font-size:.72rem;color:#333333;margin-bottom:3px;}
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.85rem;font-family:inherit;background:#ffffff;
  }
  .field textarea{resize:vertical;min-height:38px;}
  .mini-table{width:100%;border-collapse:collapse;font-size:.78rem;}
  .mini-table th{background:var(--sky);padding:6px 4px;font-size:.7rem;color:var(--navy-deep);}
  .mini-table td{padding:4px;border-bottom:1px solid #e1e1e1;}
  .mini-table input{width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;font-size:.8rem;text-align:center;}

  .proc-group h4{font-size:.76rem;color:var(--amber);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.02em;}
  .month-range-box{background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .mr-title{font-size:.84rem;font-weight:700;color:var(--navy-deep);margin-bottom:8px;}
  .mr-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mr-row label{font-size:.75rem;color:#333333;}
  .mr-row input[type=month]{flex:1;min-width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.82rem;font-family:inherit;}
  .month-range-box .export-btn{margin-bottom:0;}
  .exp-mode-row{display:flex;gap:6px;margin-bottom:10px;}
  .exp-mode-btn{flex:1;padding:8px;border:1.5px solid var(--navy);background:#ffffff;color:var(--navy);border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;}
  .exp-mode-btn.active{background:var(--navy);color:#ffffff;}

  .proc-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px;flex-wrap:wrap;}
  .proc-toolbar-btns{display:flex;gap:6px;align-items:center;}
  .proc-shift-tag{font-size:.74rem;font-weight:700;padding:4px 9px;border-radius:6px;color:#ffffff;}
  .proc-shift-tag.shift-ดึก{background:var(--shift-night);}
  .proc-shift-tag.shift-เช้า{background:var(--shift-morn);}
  .proc-shift-tag.shift-บ่าย{background:var(--shift-aft);}
  .btn-proc-copy{background:#ffffff;border:1.5px solid var(--navy);color:var(--navy);border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .proc-row input:disabled{background:#dde1e9;color:#3c3c3c;opacity:1;}
  .proc-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e5e5e5;}
  .proc-row .lbl{flex:1;font-size:.8rem;}
  .proc-row .unit{font-size:.68rem;color:#4c4c4c;width:34px;}
  .proc-row input{width:56px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:.85rem;}

  .diag-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #e5e5e5;}
  .diag-row label{flex:1;font-size:.82rem;}
  .diag-row input{width:56px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center;}

  .staff-select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;margin-bottom:10px;}

  .export-btn{display:flex;align-items:center;gap:10px;width:100%;background:#ffffff;border:1.5px solid var(--navy);color:var(--navy-deep);border-radius:10px;padding:13px 14px;font-size:.85rem;font-weight:700;margin-bottom:10px;cursor:pointer;text-align:left;}
  .export-btn .icon{font-size:1.3rem;}
  .export-btn small{display:block;font-weight:400;color:#3c3c3c;font-size:.72rem;margin-top:2px;}
  .export-btn:active{background:var(--sky);}
  .export-all{background:var(--navy);color:#ffffff;border-color:var(--navy);}
  .export-all small{color:rgba(255,255,255,.8);}

  .note{font-size:.74rem;color:#8a6d1f;background:#fff1d1;border:1px solid #f0dfa8;border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
  .syncbar{background:#dde7f7;border-bottom:1px solid var(--line);padding:6px 14px;text-align:center;}
  
  
  .syncbar{padding:0;border:0;}
    

  .prev-overlay{position:fixed;inset:0;z-index:998;background:rgba(0,0,0,.55);
                display:flex;align-items:center;justify-content:center;padding:6px;}
  .prev-box{background:#fff;border-radius:12px;width:100%;max-width:1200px;
            height:calc(100vh - 12px);height:calc(100dvh - 12px);
            display:flex;flex-direction:column;overflow:hidden;}
  .prev-head{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--navy);color:#fff;}
  .prev-head span{flex:1;font-weight:700;font-size:.86rem;}
  .prev-head button{background:rgba(255,255,255,.3);border:none;color:#fff;font-size:.9rem;
                    width:32px;height:32px;border-radius:8px;cursor:pointer;}
  .prev-body{flex:1;min-height:0;overflow:auto;padding:6px;background:#f4f6fa;}
  /* แสดงขนาดเท่าไฟล์ PDF จริง (กว้าง 780px) เพื่อให้แคปจอแล้วได้เหมือนกัน */
  .prev-fit{margin:0 auto;overflow:hidden;}
  .prev-head button.prev-zoom{width:auto;padding:0 10px;font-size:.72rem;font-weight:700;}
  .prev-sheet{width:780px;padding:20px;background:#fff;margin:0 auto;}
  .prev-foot{padding:6px 10px;border-top:1px solid var(--line);}
  .prev-foot button{width:100%;background:var(--ok);color:#fff;border:none;border-radius:8px;
                    padding:9px;font-size:.85rem;font-weight:700;cursor:pointer;}
  .prev-foot button:disabled{opacity:.6;}
  .report-title{font-weight:700;font-size:1rem;margin:0 0 4px;text-align:center;}

  .view-btn{display:block;width:calc(100% - 8px);background:var(--navy);color:#ffffff;border:none;border-radius:8px;padding:9px;font-size:.8rem;font-weight:700;margin:0 4px 12px;cursor:pointer;}
  .report-sub{font-size:.86rem;margin:0 0 14px;text-align:center;color:#555;}
  table.report-table{width:100%;border-collapse:collapse;font-size:.8rem;}
  table.report-table th, table.report-table td{border:1px solid #999;padding:5px 7px;text-align:left;white-space:pre-line;}
  table.report-table th{background:#eef1f8;color:var(--navy-deep);text-align:center;}
  table.report-table td.rlabel{font-weight:600;background:#fbfbfd;width:32%;}
  table.report-table td.rshift{text-align:center;}
  tr.rsection td{background:var(--sky);font-weight:700;color:var(--navy-deep);}

  .popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:24px;}
  .popup-box{background:#ffffff;border-radius:14px;padding:20px;max-width:340px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.25);}
  .popup-box p{margin:0 0 16px;font-size:.85rem;line-height:1.6;color:var(--ink);white-space:pre-line;}
  .popup-ok-btn{width:100%;background:var(--navy);color:#ffffff;border:none;border-radius:8px;padding:11px;font-size:.85rem;font-weight:700;cursor:pointer;}

  table.daily-table input.input-invalid{border-color:var(--danger) !important;background:#fbd9d5 !important;color:var(--danger) !important;}
  .yn{display:flex;gap:14px;}
  .yn label{display:flex;align-items:center;gap:4px;font-size:.8rem;}

  .local-shift-picker{display:none;gap:6px;padding:10px 16px;background:#ffffff;border-bottom:1px solid var(--line);align-items:center;}
  .local-shift-picker span{font-size:.75rem;color:#333333;margin-right:4px;}

  .daily-section-title{font-size:.82rem;font-weight:700;color:var(--navy-deep);margin:16px 4px 8px;}
  .scroll-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 3px rgba(13,59,140,.06);}
  table.daily-table{width:100%;min-width:480px;border-collapse:collapse;font-size:.78rem;background:#ffffff;table-layout:fixed;}
  table.daily-table.staff-table{min-width:620px;}
  table.daily-table.p4pd-table{min-width:0;}
  table.daily-table.p4pd-table input{min-width:0;font-size:.78rem;padding:6px 2px;}
  table.daily-table.p4pd-table td.label{font-size:.64rem;}
  table.daily-table.p4pd-table th{font-size:.66rem;}
  table.daily-table tr.p4pd-linked td{background:#e9edf5;}
  table.daily-table tr.p4pd-linked input{background:#dde1e9;color:#2a2a2a;font-weight:600;}
  .p4pd-hint{font-size:.66rem;color:#444444;margin:6px 4px 0;}
  .p4pd-submit-row{display:flex;margin:10px 0 0;}
  .p4pd-submit-spacer{flex:0 0 104px;}
  .p4pd-submit-cell{flex:1;min-width:0;margin:0 2px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#ffffff;border:1px solid var(--line);border-radius:8px;padding:7px 4px;}
  .p4pd-submit-label{font-size:.68rem;font-weight:700;color:#ffffff;padding:2px 8px;border-radius:5px;}
  .p4pd-submit-label.shift-ดึก{background:var(--shift-night);}
  .p4pd-submit-label.shift-เช้า{background:var(--shift-morn);}
  .p4pd-submit-label.shift-บ่าย{background:var(--shift-aft);}
  table.daily-table.p4pd-table input:disabled{background:#dde1e9 !important;color:#444444 !important;opacity:1;}
  table.daily-table .sticky-col, table.daily-table td.label{position:sticky;left:0;z-index:2;box-shadow:2px 0 4px rgba(0,0,0,.08);}
  table.daily-table tr:first-child>th:first-child{z-index:4;}
  table.daily-table th{background:var(--sky);color:var(--navy-deep);padding:6px 4px;font-size:.7rem;border:1px solid var(--line);white-space:nowrap;}
  table.daily-table th.hd-ดึก{background:#bfc7eb;color:var(--shift-night);}
  table.daily-table th.hd-เช้า{background:#f5d9b3;color:var(--shift-morn);}
  table.daily-table th.hd-บ่าย{background:#b9dfc3;color:var(--shift-aft);}
  table.daily-table td{padding:3px;border:1px solid var(--line);text-align:center;vertical-align:middle;}
  table.daily-table td.label{text-align:left;padding-left:6px;font-size:.68rem;white-space:normal;line-height:1.25;background:#f7f7fb;}
  table.daily-table input, table.daily-table select{width:100%;padding:6px 3px;border:1px solid var(--line);border-radius:5px;font-size:.8rem;text-align:center;font-family:inherit;min-width:52px;}
  table.daily-table input[readonly]{background:#dde1e9;color:#2a2a2a !important;font-weight:700 !important;}
  table.daily-table input:disabled, table.daily-table select:disabled{background:#dde1e9 !important;color:#3c3c3c !important;font-weight:400 !important;opacity:1;}

  .event-card{border-radius:12px;padding:12px;margin-bottom:12px;}
  .event-card.card-ดึก{background:#ede9c9;}
  .event-card.card-เช้า{background:#f9d5e7;}
  .event-card.card-บ่าย{background:#cbdff1;}
  .event-card h4{margin:0 0 10px;font-size:.86rem;}
  .event-card.card-ดึก h4{color:var(--shift-night);}
  .event-card.card-เช้า h4{color:var(--shift-morn);}
  .event-card.card-บ่าย h4{color:var(--shift-aft);}
  .event-field{margin-bottom:8px;}
  .event-field label{display:block;font-size:.7rem;color:#333333;margin-bottom:2px;}
  .event-field input, .event-field select, .event-field textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:7px;font-size:.8rem;font-family:inherit;background:#ffffff;}
  .event-field textarea{min-height:44px;resize:vertical;}
  .event-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .event-field input[readonly]{background:#e1e1e1;color:#2a2a2a;}
  .ic-wrap{margin-top:8px;}
  .ic-empty,.ic-hint{font-size:.72rem;color:#444444;display:block;}
  .ic-follow{display:flex;align-items:flex-start;gap:8px;background:#ffffff;border:1px solid var(--line);
             border-radius:10px;padding:9px;margin-bottom:7px;}
  .ic-follow input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:2px;}
  .ic-follow-main{flex:1;min-width:0;font-size:.76rem;line-height:1.45;}
  .ic-sub{display:block;font-size:.68rem;color:#363b48;}
  .ic-warn{display:block;font-size:.68rem;color:#8a6d1f;background:#fff1d1;border:1px solid #f0dfa8;
           border-radius:5px;padding:3px 6px;margin-top:4px;}
  .ic-close-btn{background:#ffffff;border:1.5px solid var(--danger);color:var(--danger);border-radius:6px;
                padding:3px 8px;font-size:.64rem;font-weight:700;cursor:pointer;flex:0 0 auto;}
  .ic-add-follow,.ic-add-new{width:100%;background:#ffffff;border:1.5px dashed var(--navy);color:var(--navy);
            border-radius:8px;padding:9px;font-size:.74rem;font-weight:700;cursor:pointer;}
  .ic-card{background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .ic-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .ic-head span{font-size:.74rem;font-weight:700;color:var(--navy-deep);}
  .ic-saved{color:#14653a;font-size:.64rem;font-weight:700;margin-left:6px;white-space:nowrap;}
  .ic-draft{border:1.5px solid var(--navy);}
  .ic-cancel{background:#ffffff;border:1px solid var(--line);color:#3c3c3c;border-radius:6px;
             padding:3px 9px;font-size:.64rem;cursor:pointer;}
  .ic-need{background:#fbd9d5;border:1px solid #efa9a9;color:#8c2020;border-radius:6px;
           padding:5px 8px;font-size:.66rem;margin-top:7px;}
  .ic-add-row{display:flex;justify-content:flex-end;margin-top:8px;}
  .ic-commit{background:#7fc79a;color:#ffffff;border:none;border-radius:5px;
             padding:3px 10px;font-size:.64rem;font-weight:700;cursor:pointer;}
  .ic-del{background:#ffffff;border:1.5px solid var(--danger);color:var(--danger);border-radius:6px;
          padding:3px 9px;font-size:.66rem;font-weight:700;cursor:pointer;}
  .ic-card label{display:block;font-size:.66rem;color:#333333;margin:6px 0 2px;}
  .ic-card input,.ic-card select,.ic-card textarea{width:100%;padding:7px;border:1px solid var(--line);
          border-radius:6px;font-size:.78rem;font-family:inherit;background:#ffffff;}
  .ic-card input:disabled,.ic-card select:disabled,.ic-card textarea:disabled{background:#e5e5e5;color:#3c3c3c;opacity:1;}
  .ic-patient{margin:6px 0;padding:7px 9px;background:#dde7f7;border-radius:7px;font-size:.72rem;line-height:1.45;}
  .ic-found{color:var(--navy-deep);}
  .ic-mode-btn{flex:1;padding:8px;border:1.5px solid var(--navy);background:#ffffff;color:var(--navy);
               border-radius:8px;font-size:.8rem;font-weight:700;cursor:pointer;}
  .ic-mode-btn.active{background:var(--navy);color:#ffffff;}
  .inc-wrap{margin-top:8px;}
  .inc-card{background:#ffffff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;}
  .inc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .inc-head span{font-size:.74rem;font-weight:700;color:var(--navy-deep);}
  .inc-del{background:#ffffff;border:1.5px solid var(--danger);color:var(--danger);border-radius:6px;
           padding:3px 9px;font-size:.66rem;font-weight:700;cursor:pointer;}
  .inc-card label{display:block;font-size:.66rem;color:#333333;margin:6px 0 2px;}
  .inc-card select,.inc-card input,.inc-card textarea{width:100%;padding:7px;border:1px solid var(--line);
           border-radius:6px;font-size:.78rem;font-family:inherit;background:#ffffff;}
  .inc-card select:disabled,.inc-card input:disabled,.inc-card textarea:disabled{background:#e5e5e5;color:#3c3c3c;opacity:1;}
  .inc-warn{background:#fbd9d5;border:1px solid #efa9a9;color:#8c2020;border-radius:6px;
            padding:6px 8px;font-size:.68rem;font-weight:700;margin-top:6px;}
  .inc-add{width:100%;background:#ffffff;border:1.5px dashed var(--navy);color:var(--navy);border-radius:8px;
           padding:9px;font-size:.76rem;font-weight:700;cursor:pointer;}
  .inc-empty{font-size:.72rem;color:#444444;}
  .germ-pairs{margin-top:8px;display:flex;flex-direction:column;gap:6px;}

  .event-scroll-row{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .event-card-slot{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;padding-right:6px;}

  .submitted-tag{font-size:.7rem;color:var(--navy);font-weight:400;margin-left:6px;}
  .event-submit-row{margin-top:10px;display:flex;justify-content:flex-end;}
  .btn-event-submit{background:#7fc79a;color:#ffffff;border:none;border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .btn-event-edit{background:var(--danger);border:none;color:#ffffff;border-radius:6px;padding:4px 8px;font-size:.68rem;font-weight:700;cursor:pointer;}
  .event-field select[disabled], .event-field input[disabled], .event-field textarea[disabled]{background:#e5e5e5;color:#3c3c3c;opacity:1;}

  table.daily-table input[data-shift="ดึก"], table.daily-table select[data-shift="ดึก"]{color:var(--shift-night);font-weight:600;}
  table.daily-table input[data-shift="เช้า"], table.daily-table select[data-shift="เช้า"]{color:var(--shift-morn);font-weight:600;}
  table.daily-table input[data-shift="บ่าย"], table.daily-table select[data-shift="บ่าย"]{color:var(--shift-aft);font-weight:600;}

  table.daily-table tr.care-group-misc td{background:#ffffff;}
  table.daily-table tr.care-group-sedative td{background:#d5e3f9;}
  table.daily-table tr.care-group-sedative td.label{background:#b7d1f5;}
  table.daily-table tr.care-group-cvp td{background:#fbe7c7;}
  table.daily-table tr.care-group-cvp td.label{background:#f5cf91;}
  table.daily-table tr.care-group-vent td{background:#d1edd9;}

// keep บุคลากร&สถิติผู้ป่วย, การพยาบาลพิเศษ and the event cards scrolled to the same shift
function attachDailyScrollSync(){
  const staff = document.getElementById("scroll-staff");
  const care  = document.getElementById("scroll-care");
  const events = document.getElementById("event-scroll-row");
  const parts = [staff, care, events].filter(Boolean);
  let syncing = false;
  parts.forEach(src=>{
    src.addEventListener("scroll", ()=>{
      if(syncing) return;
      syncing = true;
      // translate position into a 0..1 ratio so differing widths still line up
      const ratio = src.scrollWidth > src.clientWidth
        ? src.scrollLeft / (src.scrollWidth - src.clientWidth) : 0;
      parts.forEach(other=>{
        if(other === src) return;
        const max = other.scrollWidth - other.clientWidth;
        if(max > 0) other.scrollLeft = ratio * max;
      });
      requestAnimationFrame(()=>{ syncing = false; });
    });
  });
}

// ---- ข้อมูลผู้ป่วยจากระบบลงทะเบียน (อ่านอย่างเดียว) ----
const REG_URL = "https://script.google.com/macros/s/AKfycbz67llALRKtVGJwVew6PKmVynCO6tibYGh4T5eiBdYHfabp4TStZ9ODHfDOCDc89zU6/exec";
let regPatients = null;          // null = ยังไม่โหลด
async function loadRegistry(){
  if(regPatients) return regPatients;
  try{
    const res = await fetch(REG_URL + "?action=load&t=" + Date.now());
    const j = await res.json();
    regPatients = (j && j.ok && Array.isArray(j.patients)) ? j.patients : [];
  }catch(err){ regPatients = []; }
  return regPatients;
}
function regFind(hn){
  if(!regPatients || !hn) return null;
  const key = String(hn).trim();
  return regPatients.find(p => String(p.hn || "").trim() === key) || null;
}
function regIsDischarged(hn){
  const p = regFind(hn);
  if(!p) return false;
  return !!(p.dischargeDate || String(p.status || "").includes("จำหน่าย"));
}

function icAll(){

  scheduleCloudSave && scheduleCloudSave();
}
function daysBetween(aISO, bISO){
  const a = new Date(aISO + "T00:00:00"), b = new Date(bISO + "T00:00:00");
  return Math.round((b - a) / 86400000);
}
// เคสที่ยังติดตามอยู่ ณ วันที่กำหนด
function icActive(dateKey){
  return icAll().filter(x=>{
    if(x.closed) return false;
    const age = daysBetween(x.foundDate || x.createdDate, dateKey);
    if(age < 0 || age > IC_FOLLOW_DAYS) return false;
    if(regIsDischarged(x.hn)) return false;
    return true;
  });
}

function renderIcFollow(sh, locked){
  const dis = locked ? "disabled" : "";
  const active = icActive(currentDateKey);
  const ticked = getDeep(data.shifts[sh], "events.germFollow") || {};
  let html = `<div class="ic-wrap">`;
  if(!active.length){
    html += `<div class="ic-empty">ยังไม่มีผู้ป่วยเชื้อดื้อยาที่ติดตามอยู่ — ลงรายใหม่ได้ที่ตัวเลือก "พบเชื้อดื้อยารายใหม่"</div>`;
  } else {
    active.forEach(x=>{
      // เคยติ๊กไว้ = ติ๊กต่อให้เอง จนกว่าจะเอาออกหรือปิดเคส
      const on = (ticked[x.id] === undefined) ? true : !!ticked[x.id];
      const age = daysBetween(x.foundDate || x.createdDate, currentDateKey);
      html += `<label class="ic-follow">
        <input type="checkbox" ${dis} ${on?"checked":""} class="ic-tick" data-sh="${sh}" data-id="${x.id}">
        <span class="ic-follow-main">
          <b>เตียง ${x.bed||"-"} · ${x.name||"(ไม่ทราบชื่อ)"}</b>${on?`<span class="ic-saved">✓ บันทึกแล้ว</span>`:""}
          <span class="ic-sub">${x.organism||"-"}${x.hn?` · HN ${x.hn}`:""} · ลงเมื่อ ${thaiShort(x.foundDate||x.createdDate)} (${age} วัน)</span>
          ${age >= IC_WARN_DAYS ? `<span class="ic-warn">⚠ ติดตามมา ${age} วันแล้ว — ยังพบเชื้ออยู่ไหม?</span>` : ""}
        </span>
        ${locked?"":`<button type="button" class="ic-close-btn" data-id="${x.id}">ปิดเคส</button>`}
      </label>`;
    });
  }
  if(!locked){
    html += `<button type="button" class="ic-add-new" data-sh="${sh}">+ เพิ่มรายใหม่</button>`;
    if(icFormOpen[sh]) html += renderIcNew(sh, locked);
  }
  html += `</div>`;
  return html;
}

function thaiShort(iso){
  if(!iso) return "-";
  const [y,m,d] = iso.split("-").map(Number);
  return `${d}/${m}/${y+543}`;
}

// ช่องบังคับของฟอร์มรายใหม่
function icDraftMissing(sh){
  const d = icDraft[sh] || {};
  const need = [["hn","HN"],["bed","เตียง"],["organism","เชื้อ"],["specimen","สิ่งส่งตรวจ"],["foundDate","วันที่ผลเพาะเชื้อ"]];
  if(d.organism === "อื่นๆ") need.push(["organismOther","ชื่อเชื้อ"]);
  if(IC_SPEC_SITES[d.specimen]) need.push(["specSite",`ตำแหน่ง ${d.specimen}`]);
  if(IC_SPEC_NEED_TEXT.includes(d.specimen) || (IC_SPEC_SITES[d.specimen] && d.specSite === "อื่นๆ"))
    need.push(["specDetail","ระบุตำแหน่ง/รายละเอียด"]);
  return need.filter(([k])=> !String(d[k]||"").trim()).map(([,label])=>label);
}

function icPatientLine(x, sh){
  if(!x.hn) return `<span class="ic-hint">พิมพ์ HN เพื่อดึงข้อมูลผู้ป่วย</span>`;
  const p = regFind(x.hn);
  if(!p) return `<span class="ic-hint">ไม่พบ HN นี้ในระบบลงทะเบียน — กรอกชื่อเอง:
    <input type="text" class="icd-f" data-sh="${sh}" data-k="name" value="${x.name||""}" placeholder="ชื่อ-นามสกุล"></span>`;
  return `<span class="ic-found"><b>${p.name||"-"}</b>${p.age?` · ${p.gender||""} ${p.age} ปี`:""}
    ${p.admitFrom?` · รับจาก ${p.admitFrom}`:""}${p.diagnosis?` · ${p.diagnosis}`:""}</span>`;
}

function icNewId(){ return "ic" + Date.now() + Math.random().toString(36).slice(2,6); }

document.getElementById("daily-table-wrap").addEventListener("click", (e)=>{
  const addNew = e.target.closest(".ic-add-new");
  const cancel = e.target.closest(".ic-cancel");
  const commit = e.target.closest(".ic-commit");
  const close  = e.target.closest(".ic-close-btn");

  if(addNew){
    const sh = addNew.dataset.sh;
    icFormOpen[sh] = true;
    icDraft[sh] = { labDate: currentDateKey, sendStatus: IC_SEND_STATUS[0] };
    renderEventsRow();
  } else if(cancel){
    const sh = cancel.dataset.sh;
    icFormOpen[sh] = false; icDraft[sh] = {};
    renderEventsRow();
  } else if(commit){
    const sh = commit.dataset.sh;
    const miss = icDraftMissing(sh);
    if(miss.length){ showPopup("กรุณากรอกให้ครบก่อนเพิ่ม:\n- " + miss.join("\n- ")); return; }
    const d = icDraft[sh];
    const p = regFind(d.hn);
    const list = icAll();
    const id = icNewId();
    list.push({ id, shift:sh, createdDate:currentDateKey,
                hn:d.hn, bed:d.bed, name:(p && p.name) || d.name || "",
                admitFrom:(p && p.admitFrom) || "", diagnosis:(p && p.diagnosis) || "",
                organism:d.organism, organismOther:d.organismOther||"", specimen:d.specimen,
                specSite:d.specSite||"", specDetail:d.specDetail||"",
                labDate:d.labDate||currentDateKey, foundDate:d.foundDate,
                sendStatus:d.sendStatus||IC_SEND_STATUS[0], note:d.note||"", closed:false });
    icSave(list);
    // เคสใหม่ถือว่าพบวันนี้ จึงติ๊กไว้ให้เลย
    const ticked = getDeep(data.shifts[sh], "events.germFollow") || {};
    ticked[id] = true;
    setDeep(data.shifts[sh], "events.germFollow", ticked);
    saveStore();
    icFormOpen[sh] = false; icDraft[sh] = {};
    renderEventsRow();
  } else if(close){
    const id = close.dataset.id;
    const reason = prompt("เหตุผลที่ปิดเคส:\n1 = เพาะเชื้อไม่ขึ้นแล้ว\n2 = จำหน่าย/ย้ายออก\n3 = อื่นๆ", "1");
    if(reason === null) return;
    const list = icAll();
    const it = list.find(x=>x.id === id);
    if(it){
      it.closed = true;
      it.closeReason = IC_CLOSE_REASONS[(parseInt(reason)||1) - 1] || IC_CLOSE_REASONS[2];
      it.closeDate = currentDateKey;
      icSave(list); renderEventsRow();
    }
  }
});

function validateEventCard(sh){
  const sd = data.shifts[sh];
  const g = (p)=> { const v = getDeep(sd,p); return v!==undefined&&v!==null? String(v).trim() : ""; };
  const missing = [];

  const productivity = getDeep(data.shifts[sh], "productivity");
  if(productivity === undefined || productivity === null || String(productivity).trim() === "") missing.push("Productivity");

  const staffStatus = g('events.staffStatus') || STAFF_STATUS_OPTIONS[0];
  if(staffStatus !== STAFF_STATUS_OPTIONS[0] && !g('events.staffCount')) missing.push("จำนวนเจ้าหน้าที่ (ราย)");

  const generalStatus = g('events.general') || GENERAL_OPTIONS[0];
  if(generalStatus === GENERAL_OPTIONS[1]){
    const inc = getIncidents(sh);
    if(!inc.length) missing.push("ยังไม่ได้เพิ่มอุบัติการณ์");
    else inc.forEach((it,n)=>{
      if(!it.group || !it.sev) missing.push(`อุบัติการณ์ที่ ${n+1}: เลือกหมวดและระดับให้ครบ`);
    });
  }

  const ethicsStatus = g('events.ethics') || ETHICS_OPTIONS[0];
  if(ethicsStatus === ETHICS_OPTIONS[1] && !g('events.ethicsDetail')) missing.push("รายละเอียดความเสี่ยงจริยธรรม");

  const germStatus = g('events.germStatus') || GERM_OPTIONS[0];
  if(germStatus === GERM_OPTIONS[1]){
    const ticked = getDeep(data.shifts[sh], "events.germFollow") || {};
    const anyTicked = Object.keys(ticked).some(id=>ticked[id]);
    if(!anyTicked) missing.push("เชื้อดื้อยา: ติ๊กรายการที่พบ หรือเพิ่มรายใหม่");
  }

  if(!g('incharge')) missing.push("Incharge");

  if(!g('staff.RN.normal')) missing.push("RN");
  if(!g('staff.NA.normal')) missing.push("NA");
  if(!g('staff.W.normal')) missing.push("W (คนงาน)");
  if(!g('ptype.p5')) missing.push("ผป.ประเภท 5");
  if(!g('ptype.p4')) missing.push("ผป.ประเภท 4");
  if(!g('ptype.p3')) missing.push("ผป.ประเภท 3");
  if(!g('ptype.p2')) missing.push("ผป.ประเภท 2");

  if(invalidRemainShifts.has(sh)) missing.push("ยอดคงพยาบาลไม่ถูกต้อง (เกิน 8 เตียง หรือติดลบ) — ตรวจสอบยอดรับ/ย้าย/จำหน่าย");

  return missing;
}

const REMAIN_INPUT_PATHS = ["census.carry","census.newAdmit","census.transferIn","census.discharge","census.transferOut","census.dead"];
function computeRemain(sh){
  const sd = data.shifts[sh];
  const num = (path)=> { const v = getDeep(sd, path); const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  return num("census.carry") + num("census.newAdmit") + num("census.transferIn")
       - num("census.discharge") - num("census.transferOut") - num("census.dead");
}
let invalidRemainShifts = new Set();
function updateRemainDisplay(sh){
  const val = computeRemain(sh);
  setDeep(data.shifts[sh], "census.remain", val);
  const el = document.querySelector(`#daily-table-wrap input[data-shift="${sh}"][data-f="census.remain"]`);
  if(el) el.value = val;
  renderP4pdList(); // คงพยาบาล is mirrored into the p4p tab

  if(val > 8 || val < 0){
    invalidRemainShifts.add(sh);
    if(el) el.classList.add("input-invalid");
    showPopup(`เวร${sh}: คำนวณคงพยาบาลได้ ${val} คน ไม่ถูกต้อง (ต้องอยู่ระหว่าง 0-8 เตียง)\nกรุณาตรวจสอบยอดยกมา/รับใหม่/รับย้าย/จำหน่าย/ย้าย-ส่งต่อ/ถึงแก่กรรม`);
  } else {
    invalidRemainShifts.delete(sh);
    if(el) el.classList.remove("input-invalid");
  }

  const idx = SHIFTS.indexOf(sh);
  const nextShift = SHIFTS[idx+1];
  if(nextShift){
    setDeep(data.shifts[nextShift], "census.carry", val);
    const nextInput = document.querySelector(`#daily-table-wrap input[data-shift="${nextShift}"][data-f="census.carry"]`);
    if(nextInput) nextInput.value = val;
    updateRemainDisplay(nextShift); // cascade: next shift's own remain depends on its carry too
  }
}

/* ===== รหัสวันในชีท =====
   ชีทแปลงข้อความ "2026-10-08" เป็นวันที่เอง ทำให้หาแถวเดิมไม่เจอ (เครื่องอื่นไม่เห็น และเพิ่มแถวซ้ำทุกครั้ง) จึงเติม D นำหน้า */
function cloudDayKey(k){ return "D" + k; }
const MON3 = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
// แปลงรหัสจากชีทกลับเป็น yyyy-mm-dd พร้อมลำดับความเชื่อถือ: รหัสใหม่ > ข้อความแบบเดิม > แถวเดิมที่ถูกแปลงเป็นวันที่ (กู้คืนได้)
function parseServerDayKey(k){
  k = String(k);
  let m = k.match(/^D(\d{4}-\d{2}-\d{2})$/); if(m) return { date:m[1], prio:3 };
  m = k.match(/^(\d{4}-\d{2}-\d{2})$/); if(m) return { date:m[1], prio:2 };
  m = k.match(/^[A-Z][a-z]{2} ([A-Z][a-z]{2}) (\d{1,2}) (\d{4})/);          // "Thu Oct 08 2026 00:00:00 GMT+0700 ..."
  if(m && MON3[m[1]]) return { date:`${m[3]}-${String(MON3[m[1]]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`, prio:1 };
  return null;
}
function thaiShortDate(k){ const [y,m,d] = k.split("-").map(Number); return `${d}/${m}/${y+543}`; }

/* ===== บีบอัดเมื่อข้อมูลใหญ่ (เซลล์ชีทเก็บได้ไม่เกิน 50,000 ตัวอักษร) ===== */
function loadPako(){
  return new Promise((res, rej)=>{
    if(window.pako) return res(window.pako);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js";
    s.onload = ()=> window.pako ? res(window.pako) : rej(new Error("โหลดตัวบีบอัดไม่สำเร็จ"));
    s.onerror = ()=> rej(new Error("โหลดตัวบีบอัดไม่สำเร็จ"));
    document.head.appendChild(s);
  });
}
async function gzipBytes(str){
  if(typeof CompressionStream !== "undefined"){
    const cs = new CompressionStream("gzip"), wr = cs.writable.getWriter();
    wr.write(new TextEncoder().encode(str)); wr.close();
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }
  return (await loadPako()).gzip(str);
}
async function gunzipText(bytes){
  if(typeof DecompressionStream !== "undefined"){
    const ds = new DecompressionStream("gzip"), wr = ds.writable.getWriter();
    wr.write(bytes); wr.close();
    return await new Response(ds.readable).text();
  }
  return (await loadPako()).ungzip(bytes, { to:"string" });
}
function bytesToB64(bytes){ let bin=""; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function b64ToBytes(b64){ const bin=atob(b64), out=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function packData(obj){ return { z: "gz1:" + bytesToB64(await gzipBytes(JSON.stringify(obj))) }; }
async function packIfLarge(obj){ return JSON.stringify(obj).length > 40000 ? packData(obj) : obj; }
async function unpackData(d){
  if(d && typeof d.z === "string" && d.z.indexOf("gz1:") === 0) return JSON.parse(await gunzipText(b64ToBytes(d.z.slice(4))));
  return d;
}

/* ===== งานที่ค้างส่ง: จดไว้ในเครื่อง ส่งสำเร็จค่อยลบ (ปิดหน้า/เน็ตหลุด ก็ไม่หาย) ===== */
function pendingAll(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || "{}") || {}; }catch(e){ return {}; } }
function pendingSave(p){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }catch(e){} }
function pendingMark(k){
  const p = pendingAll();
  if(p[k]) p[k].t = Date.now();
  else p[k] = { t: Date.now(), base: baseSnap[k] || null };
  pendingSave(p);
}
function icPendingT(){ return parseInt(localStorage.getItem(IC_PENDING_KEY) || "0") || 0; }

/* ===== รวมข้อมูลสามทาง: ช่องที่เครื่องนี้แก้ (ต่างจากฉบับตั้งต้น) ใช้ของเครื่องนี้ ช่องอื่นใช้ของส่วนกลาง =====
   สองคนแก้วันเดียวกันคนละเวร/คนละช่อง จึงไม่ทับกัน */
function isObj(v){ return v && typeof v === "object" && !Array.isArray(v); }
function merge3(base, local, server){
  if(isObj(local) && isObj(server)){
    const out = {};
    const keys = new Set([...Object.keys(server), ...Object.keys(local), ...(isObj(base) ? Object.keys(base) : [])]);
    keys.forEach(k=>{ const v = merge3(isObj(base) ? base[k] : undefined, local[k], server[k]); if(v !== undefined) out[k] = v; });
    return out;
  }
  return JSON.stringify(local) !== JSON.stringify(base) ? local : server;
}
// ทะเบียนเชื้อ: รวมสองฝั่งตามรหัสเคส (ไม่มีเคสหาย) เคสที่ปิดแล้วชนะเสมอ
function mergeCases(server, local, preferLocal){
  const m = new Map();
  (server || []).forEach(x=>{ if(x && x.id) m.set(x.id, x); });
  (local || []).forEach(x=>{
    if(!x || !x.id) return;
    const s = m.get(x.id);
    if(!s) m.set(x.id, x);
    else if(x.closed && !s.closed) m.set(x.id, x);
    else if(!x.closed && s.closed) {}
    else if(preferLocal) m.set(x.id, x);
  });
  return [...m.values()];
}

async function getOne(kind, key){
  const res = await fetch(`${CLOUD_URL}?kind=${kind}&date=${encodeURIComponent(key)}&pw=${encodeURIComponent(AUTH_PW)}`);
  const j = await res.json();
  if(!j.ok) return { ok:false, error: j.error || "อ่านไม่สำเร็จ" };
  return { ok:true, data: await unpackData(j.data || {}) };
}
async function postOne(kind, key, data){
  const res = await fetch(CLOUD_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },      // text/plain เลี่ยง CORS preflight ที่ Apps Script ตอบไม่ได้
    body: JSON.stringify({ pw: AUTH_PW, kind, date: key, data })
  });
  const j = await res.json();
  if(!j.ok) throw new Error(j.error || "บันทึกไม่สำเร็จ");
  return j;
}

// โหลดทุกวันจากส่วนกลาง: วันที่ยังมีงานค้างในเครื่อง ของในเครื่องชนะ (แล้วค่อยส่งขึ้นไปรวม)
async function cloudLoad(silent){
  if(!authed()) return;
  setSync("กำลังโหลดจากส่วนกลาง…", "busy");
  const regPromise = getOne("ic", "registry").catch(()=>null);      // ดึงทะเบียนเชื้อพร้อมกัน ไม่ต้องรอต่อคิว
  try{
    const res = await fetch(`${CLOUD_URL}?kind=${CLOUD_KIND}&all=1&pw=${encodeURIComponent(AUTH_PW)}`);
    const j = await res.json();
    if(!j.ok) throw new Error(j.error || "โหลดไม่สำเร็จ");
    const raw = j.data || {};
    const best = {};
    Object.keys(raw).forEach(k=>{
      const info = parseServerDayKey(k); if(!info) return;
      if(!best[info.date] || info.prio > best[info.date].prio) best[info.date] = { prio: info.prio, data: raw[k] };
    });
    const pend = pendingAll();
    let n = 0, curReplaced = false;
    for(const d of Object.keys(best)){
      let rec; try{ rec = await unpackData(best[d].data); }catch(e){ continue; }
      if(!rec || !rec.shifts) continue;
      n++;
      if(pend[d]) continue;
      allDays[d] = rec; baseSnap[d] = JSON.stringify(rec);
      if(d === currentDateKey) curReplaced = true;
    }
    // ล้างรหัสแปลกที่เคยปนเข้ามาในเครื่องจากรุ่นก่อน
    Object.keys(allDays).forEach(k=>{
      if(/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const info = parseServerDayKey(k);
      if(info && !allDays[info.date]) allDays[info.date] = allDays[k];
      delete allDays[k];
    });
    if(curReplaced){ switchToDate(currentDateKey); renderAllForCurrentDay(); }
    localStorage.setItem(STORE_KEY, JSON.stringify(allDays));

    // ทะเบียนเชื้อ: รวมสองฝั่ง ไม่ใช้ทับ
    try{
      const r = await regPromise;
      if(r && r.ok && r.data && Array.isArray(r.data.cases)){
        const local = icAll();
        const merged = mergeCases(r.data.cases, local, icPendingT() > 0);
        if(JSON.stringify(merged) !== JSON.stringify(local)){
          localStorage.setItem(IC_KEY, JSON.stringify(merged));
          if(!curReplaced && typeof renderEventsRow === "function") renderEventsRow();
        }
        if(JSON.stringify(merged) !== JSON.stringify(r.data.cases) && !icPendingT())
          localStorage.setItem(IC_PENDING_KEY, String(Date.now()));   // ในเครื่องมีเคสที่ส่วนกลางยังไม่มี
      }
    }catch(e){ /* ใช้ทะเบียนในเครื่องต่อไป */ }

    setSync(`โหลดแล้ว ${n} วัน — ${new Date().toLocaleTimeString("th-TH")}`, "ok");
    if(Object.keys(pendingAll()).length || icPendingT()) flushPending(true);
  }catch(err){
    setSync("⚠ โหลดจากส่วนกลางไม่สำเร็จ: " + (err.message || err) + " — ใช้ข้อมูลในเครื่องไปก่อน", "bad");
    if(!silent) showPopup("โหลดข้อมูลจากส่วนกลางไม่สำเร็จ\n" + (err.message || err));
  }
}

// ส่งหนึ่งวัน: อ่านฉบับล่าสุดจากส่วนกลาง -> รวมสามทาง -> ส่ง -> อ่านกลับยืนยัน
async function pushDay(k){
  const p = pendingAll()[k]; if(!p) return null;
  const t = p.t;
  if(k === currentDateKey) saveStore();
  const snapStr = JSON.stringify(allDays[k] || emptyDay()), snap = JSON.parse(snapStr);
  const srv = await getOne(CLOUD_KIND, cloudDayKey(k));
  if(!srv.ok) throw new Error(srv.error);
  const hasSrv = srv.data && srv.data.shifts;
  const merged = (hasSrv && p.base) ? merge3(JSON.parse(p.base), snap, srv.data) : snap;
  const mergedStr = JSON.stringify(merged);
  const j = await postOne(CLOUD_KIND, cloudDayKey(k), await packIfLarge(merged));
  const back = await getOne(CLOUD_KIND, cloudDayKey(k));
  if(!back.ok || JSON.stringify(back.data) !== mergedStr) throw new Error("ส่งแล้วแต่อ่านกลับมาไม่ตรง");
  // ใส่ผลรวมกลับในเครื่อง (ถ้าพิมพ์เพิ่มระหว่างส่ง วางของใหม่ทับผลรวมอีกที)
  const cur = allDays[k] || snap, curStr = JSON.stringify(cur);
  const next = curStr !== snapStr ? merge3(snap, cur, merged) : merged;
  if(JSON.stringify(next) !== curStr){
    allDays[k] = next;
    if(k === currentDateKey){ switchToDate(k); renderAllForCurrentDay(); }
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(allDays));
  baseSnap[k] = mergedStr;
  const p2 = pendingAll();
  if(p2[k] && p2[k].t === t) delete p2[k];
  else if(p2[k]) p2[k].base = mergedStr;
  pendingSave(p2);
  if(p.base) scheduleRecheck(k, { base: p.base, own: snapStr, saved: mergedStr });
  return j.at;
}
/* สองเครื่องบันทึกวันเดียวกันในวินาทีเดียวกัน เครื่องหลังอาจทับเครื่องแรก:
   ตรวจซ้ำหลังส่ง ถ้าการแก้ของเครื่องนี้หายไป วางกลับเข้าไปใหม่ (ไม่ทับของเครื่องอื่น) */
const recheckJobs = {};
function scheduleRecheck(k, job){
  recheckJobs[k] = job;
  setTimeout(()=> recheckDay(k), 4000);
}
async function recheckDay(k){
  const job = recheckJobs[k]; if(!job) return;
  delete recheckJobs[k];
  try{
    const srv = await getOne(CLOUD_KIND, cloudDayKey(k));
    if(!srv.ok || !srv.data || !srv.data.shifts) return;
    const srvStr = JSON.stringify(srv.data);
    if(srvStr === job.saved) return;                                   // ไม่มีใครเขียนทับหลังเรา
    const need = merge3(JSON.parse(job.base), JSON.parse(job.own), srv.data);
    if(JSON.stringify(need) === srvStr) return;                        // การแก้ของเรายังอยู่ครบ
    // หายไป: ให้เครื่องเห็น "ส่วนกลางตอนนี้ + การแก้ของเรา (+ที่พิมพ์เพิ่มหลังจากนั้น)" แล้วส่งใหม่ โดยนับเฉพาะส่วนต่างจากส่วนกลาง
    const cur = allDays[k] || JSON.parse(job.own);
    const localNext = merge3(JSON.parse(job.own), cur, need);
    allDays[k] = localNext;
    if(k === currentDateKey){ switchToDate(k); renderAllForCurrentDay(); }
    localStorage.setItem(STORE_KEY, JSON.stringify(allDays));
    const p = pendingAll();
    p[k] = { t: Date.now(), base: srvStr };
    pendingSave(p);
    flushPending(true);
  }catch(e){}
}
async function pushRegistry(){
  const t = icPendingT(); if(!t) return;
  const srv = await getOne("ic", "registry");
  if(!srv.ok) throw new Error(srv.error);
  const local = icAll();
  const merged = mergeCases(srv.data && Array.isArray(srv.data.cases) ? srv.data.cases : [], local, true);
  const recStr = JSON.stringify({ cases: merged });
  await postOne("ic", "registry", await packData({ cases: merged }));
  const back = await getOne("ic", "registry");
  if(!back.ok || JSON.stringify(back.data) !== recStr) throw new Error("ทะเบียนเชื้อส่งแล้วแต่อ่านกลับมาไม่ตรง");
  if(JSON.stringify(merged) !== JSON.stringify(local)){
    localStorage.setItem(IC_KEY, JSON.stringify(merged));
    if(typeof renderEventsRow === "function") renderEventsRow();
  }
  if(icPendingT() === t) localStorage.removeItem(IC_PENDING_KEY);
  setTimeout(recheckRegistry, 4000);
}
// ทะเบียนเชื้อ: ตรวจซ้ำว่าเคสของเครื่องนี้ยังอยู่ครบในส่วนกลาง ถ้าหาย ส่งรวมใหม่
async function recheckRegistry(){
  try{
    const srv = await getOne("ic", "registry");
    if(!srv.ok) return;
    const srvCases = (srv.data && Array.isArray(srv.data.cases)) ? srv.data.cases : [];
    const byId = new Map(srvCases.map(x=>[x.id, x]));
    const lost = icAll().some(x=> x && x.id && (!byId.has(x.id) || (x.closed && !byId.get(x.id).closed)));
    if(lost){ localStorage.setItem(IC_PENDING_KEY, String(Date.now())); flushPending(true); }
  }catch(e){}
}

let cloudTimer = null, flushing = false, flushAgain = false;
async function flushPending(silent){
  if(!authed()) return;
  if(flushing){ flushAgain = true; return; }
  flushing = true; clearTimeout(cloudTimer);
  let msg = "";
  try{
    for(const k of Object.keys(pendingAll()).sort()){
      const at = await pushDay(k);
      if(at) msg = `✓ บันทึกเรียบร้อย วันที่ ${thaiShortDate(k)} — ทุกเครื่องเห็นแล้ว (${at})`;
    }
    await pushRegistry();
    setSync(msg || "✓ บันทึกเรียบร้อย — ทุกเครื่องเห็นแล้ว", "ok");
  }catch(err){
    setSync("⚠ ยังไม่ขึ้นส่วนกลาง: " + (err.message || err) + " — ข้อมูลเก็บในเครื่องแล้ว จะส่งให้อีกครั้งอัตโนมัติ", "bad");
    if(!silent) showPopup("บันทึกขึ้นส่วนกลางไม่สำเร็จ\n" + (err.message || err));
  }finally{
    flushing = false;
    if(flushAgain){ flushAgain = false; flushPending(true); }
  }
}
// ชื่อเดิมยังใช้ได้
function cloudSave(silent){ return flushPending(silent); }

// แค่เลือกดู (เปลี่ยนวันที่ / หน้า Export / พรีวิว) ไม่ใช่การแก้ข้อมูล: ห้ามนับเป็นงานค้าง
function isViewOnly(e){
  const t = e && e.target;
  if(!t || !t.closest) return false;
  if(t.id === "rec-date") return true;
  return !!t.closest("#export, #prev-overlay");
}
function scheduleCloudSave(e){
  if(!currentDateKey || isViewOnly(e)) return;
  if(!e || e.type !== "input") saveStore();          // การพิมพ์ถูกจดลงเครื่องอยู่แล้ว ที่เหลือจดตรงนี้
  pendingMark(currentDateKey);
  setSync("กำลังบันทึก… (อย่าเพิ่งปิดหน้า)", "busy");
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=> flushPending(true), 800);
}
document.addEventListener("input", scheduleCloudSave);
document.addEventListener("change", scheduleCloudSave);

document.addEventListener("click", (e)=>{

// ออกจากหน้า/สลับแอป: พยายามส่งงานค้างทันที (ถ้าไม่ทัน ยังอยู่ในเครื่อง และส่งให้ตอนเปิดครั้งหน้า)

/* ทุก 30 วินาที: มีงานค้าง -> ลองส่งอีกครั้ง (เน็ตหลุดแล้วกลับมา)
   ไม่มีงานค้าง -> ดึงวันที่เปิดอยู่จากส่วนกลาง ให้เห็นสิ่งที่เครื่องอื่นเพิ่งบันทึก (ข้ามถ้ากำลังพิมพ์อยู่) */
let REFRESH_MS = 30000;
async function refreshCurrentDay(){
  if(!authed() || flushing || !currentDateKey) return;
  if(pendingAll()[currentDateKey]) return;
  const a = document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest("#daily, #proc, #p4pd")) return;
  try{
    const k = currentDateKey;
    const r = await getOne(CLOUD_KIND, cloudDayKey(k));
    if(!r.ok || !r.data || !r.data.shifts) return;
    const s = JSON.stringify(r.data);
    if(s === baseSnap[k] || k !== currentDateKey || pendingAll()[k]) return;      // ไม่มีอะไรใหม่ หรือเริ่มแก้ระหว่างรอ
    allDays[k] = r.data; baseSnap[k] = s;
    switchToDate(k); renderAllForCurrentDay();
    localStorage.setItem(STORE_KEY, JSON.stringify(allDays));
  }catch(e){}
}
(function syncLoop(){
  setTimeout(async ()=>{
    try{
      if(!flushing && (Object.keys(pendingAll()).length || icPendingT())) await flushPending(true);
      else await refreshCurrentDay();
    }finally{ syncLoop(); }
  }, REFRESH_MS);
})();

/* ---- PDF export: 1 page = 1 date, all 3 shifts ---- */
function staffStatusText(sh, D){
  const s = getDeep(D.shifts[sh],'events.staffStatus') || STAFF_STATUS_OPTIONS[0];
  if(s === STAFF_STATUS_OPTIONS[0]) return s;
  const c = getDeep(D.shifts[sh],'events.staffCount') || "";
  return `${s} ${c} ราย`.trim();
}
function generalText(sh, D){
  const s = getDeep(D.shifts[sh],'events.general') || GENERAL_OPTIONS[0];
  if(s !== GENERAL_OPTIONS[1]) return s;
  const arr = getDeep(D.shifts[sh],'events.incidents');
  if(!Array.isArray(arr) || !arr.length) return "พบอุบัติการณ์ (ยังไม่ระบุรายละเอียด)";
  return arr.map((it,n)=>{
    const where = [it.bed?`เตียง ${it.bed}`:"", it.hn?`HN ${it.hn}`:""].filter(Boolean).join(" ");
    return `${n+1}) ${[it.group,it.item].filter(Boolean).join(" / ")}`
      + (it.sev?` [ระดับ ${it.sev}]`:"")
      + (where?` ${where}`:"")
      + (it.detail?` — ${it.detail}`:"")
      + (it.action?` | แก้ไข: ${it.action}`:"");
  }).join("\n");
}
function ethicsText(sh, D){
  const s = getDeep(D.shifts[sh],'events.ethics') || ETHICS_OPTIONS[0];
  return s === ETHICS_OPTIONS[1] ? (getDeep(D.shifts[sh],'events.ethicsDetail') || "-") : s;
}
function germText(sh, D){
  const s = getDeep(D.shifts[sh],'events.germStatus') || GERM_OPTIONS[0];
  if(s === GERM_OPTIONS[0]) return s;
  // ไล่จากรายการที่ติ๊กไว้ในเวรนั้น แล้วดึงชื่อเชื้อจากทะเบียน
  const ticked = getDeep(D.shifts[sh], "events.germFollow") || {};
  const all = icAll();
  const lines = Object.keys(ticked).filter(id=>ticked[id]).map(id=>{
    const x = all.find(c=>c.id === id);
    if(!x) return null;
    const org = icOrganismName(x);
    const spec = icSpecimenName(x);
    return `เตียง ${x.bed||"-"} ${x.name||""} — ${org}${spec?` / ${spec}`:""}`.trim();
  }).filter(Boolean);
  return lines.length ? `${s}\n${lines.map((l,i)=>`${i+1}) ${l}`).join("\n")}` : `${s} (-)`;
}

  const day = dd, month = mm, yearBE = yy + 543;
  const g = (sh,p)=> getDeep(D.shifts[sh], p);
  const rowsDef = [
    ["บุคลากร",null],
    ["RN (ปกติ/OT)", sh=>`${g(sh,'staff.RN.normal')||0}/${g(sh,'staff.RN.ot')||0}`],

    ["Sedative/HAD/Thrombolytic/TPN", sh=>combineCareGroup(D.shifts[sh],"sedative",[["Sedative","Sedative"],["HAD","HAD"],["Thrombolytic","Thrombolytic"],["TPN","TPN"]]) || "-"],
    ["C-LINE/A-LINE/IABP/End Tidal CO2", sh=>combineCareGroup(D.shifts[sh],"cvp",[["C-LINE","CVP"],["A-LINE","ALINE"],["IABP","IABP"],["End Tidal CO2","CO"]]) || "-"],
    ["Ventilator/HFNC/Canula/Mask with bag", sh=>combineCareGroup(D.shifts[sh],"vent",[["Ventilator","Ventilator"],["HFNC","HFNC"],["Canula","Canula"],["Mask with bag","Mask"]]) || "-"],

    ["T-piece/Off ETT", sh=>combineCareGroup(D.shifts[sh],"tpiece",[["T-piece","Tpiece"],["Off ETT","OffETT"]]) || "-"],
    ["สรุปเหตุการณ์ & ความเสี่ยง",null],
    ["เจ้าหน้าที่", sh=>staffStatusText(sh, D)],
    ["เหตุการณ์ทั่วไป", sh=>generalText(sh, D)],
    ["ความเสี่ยงจริยธรรม", sh=>ethicsText(sh, D)],
    ["เชื้อดื้อยา", sh=>germText(sh, D)],
    ["Incharge", sh=>g(sh,'incharge')||"-"],
    ["HN", ()=>HN_FIXED_NAME],
  ];

  let html = `<div class="report-title">แบบบันทึกข้อมูล หอผู้ป่วย RCU</div>
    <div class="report-sub">วันที่ ${day} เดือน ${THAI_MONTHS_FULL[month]} พ.ศ. ${yearBE}</div>
    <table class="report-table"><tr><th style="width:32%">ข้อมูล</th><th>ดึก</th><th>เช้า</th><th>บ่าย</th></tr>`;
  rowsDef.forEach(([label, fn])=>{
    if(fn === null){
      html += `<tr class="rsection"><td colspan="4">${label}</td></tr>`;
    } else {
      html += `<tr><td class="rlabel">${label}</td>${SHIFTS.map(sh=>`<td class="rshift">${fn(sh)}</td>`).join("")}</tr>`;
    }
  });
  html += `</table>`;
  return html;
}

// ย่อ "แผ่นรายงาน" ให้พอดีความกว้างจอ โดยคงเลย์เอาต์เท่าไฟล์ PDF
let prevFit = true;      // true = ย่อพอดีจอ, false = ขนาดจริง
function fitPreviewSheet(){
  const body = document.getElementById("prev-body");
  const sheet = body.querySelector(".prev-sheet");
  if(!sheet) return;
  const natural = sheet.dataset.w ? parseInt(sheet.dataset.w) : sheet.offsetWidth;
  const availW = body.clientWidth  - 12;               // เว้นขอบซ้ายขวา
  const availH = body.clientHeight - 12;               // เว้นขอบบนล่าง
  if(availW <= 0 || availH <= 0) return;               // พรีวิวปิดอยู่ ไม่ต้องคำนวณ
  const naturalH = sheet.offsetHeight;                 // ความสูงจริง (ไม่ถูกกระทบจาก transform)
  const k = prevFit ? Math.max(0.12, Math.min(1, availW / natural, availH / naturalH)) : 1;
  sheet.style.transform = `scale(${k})`;
  sheet.style.transformOrigin = "top left";
  // transform ไม่ลดพื้นที่ที่ใช้จริง จึงต้องกำหนดขนาดกล่องห่อให้ตรงกับที่ย่อแล้ว
  const wrap = sheet.parentElement;
  wrap.style.width  = (natural * k) + "px";
  wrap.style.height = (naturalH * k) + "px";
}
window.addEventListener("resize", fitPreviewSheet);

async function buildPdfDoc(key){
  if(typeof html2canvas === "undefined" || typeof window.jspdf === "undefined"){
    throw new Error("โหลดตัวช่วยสร้าง PDF ไม่สำเร็จ — ต้องมีอินเทอร์เน็ต และเปิดไฟล์นี้ผ่าน Chrome โดยตรง (ไม่ใช่ตัวดูไฟล์ในแอปดาวน์โหลด)");
  }
  const container = document.getElementById("pdf-report-container");
  try{
    container.innerHTML = buildDailyReportHtml(key);
    container.style.cssText = "display:block;position:fixed;left:0;top:0;z-index:-1;background:#fff;width:780px;padding:20px;";
    await new Promise(r=>setTimeout(r, 60));
    const canvas = await html2canvas(container, { scale:2, backgroundColor:"#ffffff" });

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("portrait", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL("image/png");

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf;
  } finally {
    container.style.cssText = "display:none;";
  }
}

/* ---- หัตถการ: monthly export across a month range, 1 sheet per month + summary ---- */
const THIN = {style:"thin", color:{rgb:"999999"}};
const BORDER_ALL = {top:THIN,bottom:THIN,left:THIN,right:THIN};
function styleCell(ws, addr, opts){
  if(!ws[addr]) ws[addr] = {v:"", t:"s"};
  ws[addr].s = Object.assign({border:BORDER_ALL, alignment:{vertical:"center", wrapText:true}}, opts||{});
}

function daysInMonth(year, month1){ return new Date(year, month1, 0).getDate(); }

function buildHattakanMonthSheet(year, month1, onlyDay){
  // rows: header, then each procedure (grouped), with a per-day column set and a month total
  // onlyDay: when given, the sheet covers just that one date instead of the whole month
  const dayFrom = onlyDay || 1;
  const dayTo   = onlyDay || daysInMonth(year, month1);
  const nDays   = dayTo - dayFrom + 1;
  const flatItems = [];
  PROC_GROUPS.forEach(g=>{
    flatItems.push({group:true, label:g.title});
    g.items.forEach(([key,label,unit])=> flatItems.push({group:false, key, label, unit}));
  });

  const aoa = [];
  const title = onlyDay
    ? `สรุปหัตถการ — วันที่ ${onlyDay} ${THAI_MONTHS_FULL[month1]} ${year+543}`
    : `สรุปหัตถการ — ${THAI_MONTHS_FULL[month1]} ${year+543}`;
  aoa.push([title]);
  aoa.push([]);
  // two header rows: day number spanning 3 shift columns, then ด/ช/บ under each
  const headDays = ["ภาระงาน","หน่วย"];
  const headShifts = ["",""];
  for(let d=dayFrom; d<=dayTo; d++){
    headDays.push(String(d), "", "");
    headShifts.push("ด","ช","บ");
  }
  headDays.push(onlyDay ? "รวมวัน" : "รวมเดือน");
  headShifts.push("");
  aoa.push(headDays);
  aoa.push(headShifts);

  const monthTotals = {};
  flatItems.forEach(item=>{
    if(item.group){
      aoa.push([item.label]);
      return;
    }
    const row = [item.label, item.unit];
    let total = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const key = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const dayRec = allDays[key];
      SHIFTS.forEach(sh=>{
        let v = dayRec ? parseFloat(getDeep(dayRec.shifts[sh], `proc.${item.key}`)) : NaN;
        if(isNaN(v)) v = 0;
        row.push(v || "");
        total += v;
      });
    }
    row.push(total || "");
    monthTotals[item.key] = total;
    aoa.push(row);
  });

  const lastCol = 2 + nDays*3; // 0-indexed column of the "รวมเดือน" cell
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:42},{wch:7}].concat(Array(nDays*3).fill({wch:3.5}), [{wch:10}]);
  ws["!freeze"] = {xSplit:2, ySplit:4};
  const merges = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  for(let d=0; d<nDays; d++){
    const c = 2 + d*3;
    merges.push({s:{r:2,c}, e:{r:2,c:c+2}});           // day number spans its 3 shift columns
  }
  merges.push({s:{r:2,c:0}, e:{r:3,c:0}});             // ภาระงาน spans both header rows
  merges.push({s:{r:2,c:1}, e:{r:3,c:1}});             // หน่วย
  merges.push({s:{r:2,c:lastCol}, e:{r:3,c:lastCol}}); // รวมเดือน
  ws["!merges"] = merges;

  // styling: title, header row, group rows, total column
  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  // two header rows (rows 2 and 3 zero-indexed)
  for(let c=0; c<=lastCol; c++){
    [2,3].forEach(hr=>{
      styleCell(ws, XLSX.utils.encode_cell({r:hr, c}),
        {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center", vertical:"center"}});
    });
  }
  let r = 4; // 0-indexed row of first data line
  flatItems.forEach(item=>{
    if(item.group){
      for(let c=0; c<=lastCol; c++){
        styleCell(ws, XLSX.utils.encode_cell({r, c}),
          {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
      }
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:1}), {alignment:{horizontal:"center"}});
      for(let d=0; d<nDays; d++){
        // shade alternate days so the 3-shift blocks stay visually separated
        const dayFill = (d % 2 === 1) ? {fill:{fgColor:{rgb:"F7F9FD"}}} : {};
        for(let s=0; s<3; s++){
          styleCell(ws, XLSX.utils.encode_cell({r, c:2 + d*3 + s}),
            Object.assign({alignment:{horizontal:"center"}}, dayFill));
        }
      }
      styleCell(ws, XLSX.utils.encode_cell({r, c:lastCol}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });

  return { ws, monthTotals };
}

function buildP4pMonthSheet(year, month1, onlyDay){
  const dayFrom = onlyDay || 1;
  const dayTo   = onlyDay || daysInMonth(year, month1);
  const nDays   = dayTo - dayFrom + 1;

  // same row order as the real form: service items, then Diagnosis
  const items = [];
  items.push({group:true, label:"ภาระงานบริการ"});
  P4PD_ROWS.forEach(([label,path,mode])=> items.push({group:false, label, path, mode}));
  items.push({group:true, label:"Diagnosis"});
  DIAG_LIST.forEach((d,i)=>{
    const depth = d.startsWith("——") ? 2 : (d.startsWith("—") ? 1 : 0);
    items.push({group:false, label:" ".repeat(depth*4) + d.replace(/^—+\s*/,""), path:`diag.d${i}`, mode:"edit"});
  });

  const aoa = [];
  aoa.push([onlyDay
    ? `ใบลงยอด P4P รายวัน — วันที่ ${onlyDay} ${THAI_MONTHS_FULL[month1]} ${year+543}`
    : `ใบลงยอด P4P รายวัน — ${THAI_MONTHS_FULL[month1]} ${year+543}`]);
  aoa.push([]);
  const headDays = ["ภาระงานบริการ"], headShifts = [""];
  for(let d=dayFrom; d<=dayTo; d++){ headDays.push(String(d),"",""); headShifts.push("ด","ช","บ"); }
  headDays.push(onlyDay ? "รวมวัน" : "รวมเดือน"); headShifts.push("");
  aoa.push(headDays); aoa.push(headShifts);

  items.forEach(item=>{
    if(item.group){ aoa.push([item.label]); return; }
    const row = [item.label];
    let total = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const key = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const rec = allDays[key];
      SHIFTS.forEach(sh=>{
        let v = 0;
        if(rec){
          if(item.mode === "rntn"){
            const n = p=>{ const x=parseFloat(getDeep(rec.shifts[sh],p)); return isNaN(x)?0:x; };
            v = n("staff.RN.normal")+n("staff.RN.ot")+n("staff.NA.normal")+n("staff.NA.ot");
          } else {
            const x = parseFloat(getDeep(rec.shifts[sh], item.path));
            v = isNaN(x) ? 0 : x;
          }
        }
        row.push(v || "");
        total += v;
      });
    }
    row.push(total || "");
    aoa.push(row);
  });

  // ---- month-end summary block (mirrors the real form's calculated rows) ----
  const sum = path=>{
    let t = 0;
    for(let d=dayFrom; d<=dayTo; d++){
      const k = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const rec = allDays[k];
      if(!rec) continue;
      SHIFTS.forEach(sh=>{ const x = parseFloat(getDeep(rec.shifts[sh], path)); if(!isNaN(x)) t += x; });
    }
    return t;
  };
  // carry-forward is a running balance, so take it from the first shift of the first recorded day
  let carryStart = 0;
  for(let d=dayFrom; d<=dayTo; d++){
    const k = `${year}-${String(month1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    if(allDays[k]){ const v = parseFloat(getDeep(allDays[k].shifts["ดึก"], "census.carry")); if(!isNaN(v)) carryStart = v; break; }
  }
  const bedDays     = sum("p4pd.bedDays");
  const totalAdmit  = sum("census.newAdmit") + sum("census.transferIn");
  const totalOut    = sum("census.discharge") + sum("census.transferOut") + sum("census.refer") + sum("census.dead");
  const deaths      = sum("census.dead");
  const remain      = carryStart + totalAdmit - totalOut;
  const totalPts    = carryStart + totalAdmit;
  const BEDS = 8;
  const r2 = v => Math.round(v*100)/100;

  aoa.push([]);
  aoa.push(["สรุปประจำเดือน"]);
  const summaryRows = [
    ["จำนวนวันนอนทั้งหมด", bedDays],
    ["จำนวนผู้ป่วยทั้งหมด", totalPts],
    ["ยอดยกมา", carryStart],
    ["รวมรับทั้งหมด", totalAdmit],
    ["รวมจำหน่ายทั้งหมด", totalOut],
    ["คงพยาบาล", remain],
    ["อัตราตาย (%)", totalPts ? r2(deaths*100/totalPts) : 0],
    ["อัตราครองเตียง (%)", nDays ? r2(bedDays*100/(BEDS*nDays)) : 0],
    ["จำนวนผู้ป่วยเฉลี่ยต่อวัน", nDays ? r2(bedDays/nDays) : 0],
    ["เฉลี่ยรับใหม่ต่อวัน", nDays ? r2(sum("census.newAdmit")/nDays) : 0],
    ["เฉลี่ยรับย้ายต่อวัน", nDays ? r2(sum("census.transferIn")/nDays) : 0],
  ];
  // monthly totals per movement type, shown beside the summary (cols D-E)
  const moveRows = [
    ["รับใหม่", sum("census.newAdmit")],
    ["รับย้าย", sum("census.transferIn")],
    ["ย้าย", sum("census.transferOut")],
    ["จำหน่าย", sum("census.discharge")],
    ["ไม่สมัครใจอยู่", sum("p4pd.notVoluntary")],
    ["Refer", sum("census.refer")],
    ["ถึงแก่กรรม", deaths],
  ];
  const summaryStartRow = aoa.length; // 0-indexed row of the first summary line
  summaryRows.forEach(([label,val],i)=>{
    const mv = moveRows[i];
    const row = [label, val, "", "", ""];      // value merged across cols B-D
    if(mv) row.push(mv[0], "", "", mv[1]);     // label merged F-H, value merged I-K
    aoa.push(row);
  });

  const lastCol = 1 + nDays*3;
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:40}].concat(Array(nDays*3).fill({wch:3.5}), [{wch:12}]);
  ws["!freeze"] = {xSplit:1, ySplit:4};
  const merges = [{s:{r:0,c:0}, e:{r:0,c:lastCol}}];
  for(let d=0; d<nDays; d++){ const col = 1 + d*3; merges.push({s:{r:2,c:col}, e:{r:2,c:col+2}}); }
  merges.push({s:{r:2,c:0}, e:{r:3,c:0}});
  merges.push({s:{r:2,c:lastCol}, e:{r:3,c:lastCol}});
  ws["!merges"] = merges;

  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  for(let col=0; col<=lastCol; col++){
    [2,3].forEach(hr=> styleCell(ws, XLSX.utils.encode_cell({r:hr, c:col}),
      {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center", vertical:"center"}}));
  }
  let r = 4;
  items.forEach(item=>{
    if(item.group){
      for(let col=0; col<=lastCol; col++) styleCell(ws, XLSX.utils.encode_cell({r, c:col}),
        {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      for(let d=0; d<nDays; d++){
        const shade = (d % 2 === 1) ? {fill:{fgColor:{rgb:"F7F9FD"}}} : {};
        for(let s=0; s<3; s++) styleCell(ws, XLSX.utils.encode_cell({r, c:1 + d*3 + s}),
          Object.assign({alignment:{horizontal:"center"}}, shade));
      }
      styleCell(ws, XLSX.utils.encode_cell({r, c:lastCol}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });

  // summary header + rows
  styleCell(ws, XLSX.utils.encode_cell({r:summaryStartRow-1, c:0}),
    {font:{bold:true, sz:12, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
  styleCell(ws, XLSX.utils.encode_cell({r:summaryStartRow-1, c:1}),
    {font:{bold:true}, fill:{fgColor:{rgb:"DDE6F7"}}});
  summaryRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    const isRate = summaryRows[i][0].includes("อัตรา");
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:0}),
      {font:{bold:isRate}, alignment:{horizontal:"left"}});
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:1}),
      {font:{bold:true, color:{rgb: isRate ? "B9432F" : "000000"}},
       fill:{fgColor:{rgb: isRate ? "FDECEA" : "FFF4E0"}}, alignment:{horizontal:"center"}});
  });
  // widen the summary + movement cells by merging across the narrow day columns
  const hdrRow = summaryStartRow - 1;
  ws["!merges"].push({s:{r:hdrRow,c:0}, e:{r:hdrRow,c:3}});
  ws["!merges"].push({s:{r:hdrRow,c:5}, e:{r:hdrRow,c:10}});
  summaryRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    ws["!merges"].push({s:{r:rr,c:1}, e:{r:rr,c:3}});
    if(moveRows[i]){
      ws["!merges"].push({s:{r:rr,c:5}, e:{r:rr,c:7}});
      ws["!merges"].push({s:{r:rr,c:8}, e:{r:rr,c:10}});
    }
  });
  // movement-total block beside the summary
  styleCell(ws, XLSX.utils.encode_cell({r:hdrRow, c:5}),
    {font:{bold:true, color:{rgb:"B9432F"}}, fill:{fgColor:{rgb:"FDECEA"}}, alignment:{horizontal:"center"}});
  ws[XLSX.utils.encode_cell({r:hdrRow, c:5})].v = "รวมทั้งเดือน";
  moveRows.forEach((_,i)=>{
    const rr = summaryStartRow + i;
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:5}), {alignment:{horizontal:"left"}, fill:{fgColor:{rgb:"FDE9F0"}}});
    styleCell(ws, XLSX.utils.encode_cell({r:rr, c:8}), {font:{bold:true}, alignment:{horizontal:"center"}, fill:{fgColor:{rgb:"FFF4E0"}}});
  });

  return ws;
}

function buildHattakanSummarySheet(monthList, totalsByMonth){
  const aoa = [];
  aoa.push([`สรุปยอดรวมหัตถการ — ${monthList.length} เดือน`]);
  aoa.push([]);
  const head = ["ภาระงาน","หน่วย"];
  monthList.forEach(m=> head.push(`${THAI_MONTHS[m.month1]}${String(m.year+543).slice(-2)}`));
  head.push("รวมทั้งหมด");
  aoa.push(head);

  const flatItems = [];
  PROC_GROUPS.forEach(g=>{
    flatItems.push({group:true, label:g.title});
    g.items.forEach(([key,label,unit])=> flatItems.push({group:false, key, label, unit}));
  });

  flatItems.forEach(item=>{
    if(item.group){ aoa.push([item.label]); return; }
    const row = [item.label, item.unit];
    let grand = 0;
    monthList.forEach(m=>{
      const v = (totalsByMonth[`${m.year}-${m.month1}`] || {})[item.key] || 0;
      row.push(v || "");
      grand += v;
    });
    row.push(grand || "");
    aoa.push(row);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const nCols = monthList.length + 2;
  ws["!cols"] = [{wch:42},{wch:7}].concat(Array(monthList.length).fill({wch:10}), [{wch:12}]);
  ws["!freeze"] = {xSplit:2, ySplit:3};
  ws["!merges"] = [{s:{r:0,c:0}, e:{r:0,c:nCols}}];

  styleCell(ws, "A1", {font:{bold:true, sz:14, color:{rgb:"0D3B8C"}}, alignment:{horizontal:"center"}});
  for(let c=0; c<=nCols; c++){
    styleCell(ws, XLSX.utils.encode_cell({r:2, c}),
      {font:{bold:true, color:{rgb:"0D3B8C"}}, fill:{fgColor:{rgb:"E8F0FD"}}, alignment:{horizontal:"center"}});
  }
  let r = 3;
  flatItems.forEach(item=>{
    if(item.group){
      for(let c=0; c<=nCols; c++){
        styleCell(ws, XLSX.utils.encode_cell({r, c}),
          {font:{bold:true, color:{rgb:"082A66"}}, fill:{fgColor:{rgb:"DDE6F7"}}});
      }
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r, c:0}), {alignment:{horizontal:"left", wrapText:true}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:1}), {alignment:{horizontal:"center"}});
      for(let c=2; c<nCols; c++) styleCell(ws, XLSX.utils.encode_cell({r, c}), {alignment:{horizontal:"center"}});
      styleCell(ws, XLSX.utils.encode_cell({r, c:nCols}),
        {font:{bold:true}, fill:{fgColor:{rgb:"FFF4E0"}}, alignment:{horizontal:"center"}});
    }
    r++;
  });
  return ws;
}

// the chosen months, validated; null if the inputs are bad
function getSelectedMonths(){
  const fromVal = document.getElementById("mr-from").value;
  const toVal = document.getElementById("mr-to").value;
  if(!fromVal || !toVal){ showPopup("กรุณาเลือกเดือนเริ่มต้นและเดือนสิ้นสุดก่อน Export"); return null; }
  const [fy, fm] = fromVal.split("-").map(Number);
  const [ty, tm] = toVal.split("-").map(Number);
  if(fy*12+fm > ty*12+tm){ showPopup("เดือนเริ่มต้นต้องมาก่อนเดือนสิ้นสุด"); return null; }
  const list = [];
  let y = fy, m = fm;
  while(y*12+m <= ty*12+tm){
    list.push({year:y, month1:m});
    m++; if(m > 12){ m = 1; y++; }
    if(list.length > 36){ showPopup("เลือกช่วงได้ไม่เกิน 36 เดือน"); return null; }
  }
  return { list, fromVal, toVal };
}

function exportHattakanMonths(){
  saveStore();
  const sel = getSelectedMonths();
  if(!sel) return;
  const wb = XLSX.utils.book_new();
  const totalsByMonth = {};
  sel.list.forEach(mo=>{
    const { ws, monthTotals } = buildHattakanMonthSheet(mo.year, mo.month1);
    totalsByMonth[`${mo.year}-${mo.month1}`] = monthTotals;
    XLSX.utils.book_append_sheet(wb, ws, `${THAI_MONTHS[mo.month1]}${String(mo.year+543).slice(-2)}`);

  XLSX.utils.book_append_sheet(wb, buildHattakanSummarySheet(sel.list, totalsByMonth), "สรุปรวม");

  XLSX.writeFile(wb, `หัตถการ_${sel.fromVal}_ถึง_${sel.toVal}.xlsx`);
}

/* ---------------- PDF ---------------- */
async function exportPdfRange(){
  const btn = document.getElementById("btn-export-pdf");
  const labelSpan = btn.querySelector("span:last-child");
  const original = labelSpan.innerHTML;
  btn.disabled = true;
  saveStore();
  try{
    if(exportMode === "day"){
      labelSpan.innerHTML = "⏳ กำลังสร้าง PDF...";
      const key = getSelectedDate();
      const pdf = await buildPdfDoc(key);
      pdf.save(`บันทึกเหตุการณ์รายวัน_${key}.pdf`);
      return;
    }
    const sel = getSelectedMonths();
    if(!sel) return;
    // every recorded day inside the chosen months, one page each
    const keys = Object.keys(allDays).filter(k=>{
      const [y,m] = k.split("-").map(Number);
      return sel.list.some(mo=> mo.year===y && mo.month1===m);
    }).sort();
    if(!keys.length){ showPopup("ไม่พบข้อมูลที่บันทึกไว้ในช่วงเดือนที่เลือก"); return; }

    let merged = null;
    for(let i=0; i<keys.length; i++){
      labelSpan.innerHTML = `⏳ กำลังสร้าง PDF... (${i+1}/${keys.length})`;
      const pdf = await buildPdfDoc(keys[i]);
      if(!merged){ merged = pdf; }
      else {
        // append this day's pages onto the growing document
        const pages = pdf.internal.pages;
        for(let p=1; p<pages.length; p++){
          merged.addPage();
          merged.internal.pages[merged.internal.pages.length-1] = pages[p];
        }
      }
    }
    merged.save(`บันทึกเหตุการณ์_${sel.fromVal}_ถึง_${sel.toVal}.pdf`);
  }catch(err){
    showPopup(`สร้าง PDF ไม่สำเร็จ:\n${err.message || err}`);
  }finally{
    labelSpan.innerHTML = original;
    btn.disabled = false;
  }
}

  {sheet:"ตค", name:"ตุลาคม",   m:10, back:true},  {sheet:"พย ", name:"พฤศจิกายน", m:11, back:true},
  {sheet:"ธค", name:"ธันวาคม",  m:12, back:true},  {sheet:"มค",  name:"มกราคม",    m:1},
  {sheet:"กพ", name:"กุมภาพันธ์", m:2},             {sheet:"มีค", name:"มีนาคม",    m:3},
  {sheet:"เมย",name:"เมษายน",   m:4},              {sheet:"พค",  name:"พฤษภาคม",   m:5},
  {sheet:"มิย",name:"มิถุนายน",  m:6},              {sheet:"กค",  name:"กรกฎาคม",   m:7},

const RM_LEVELS = ["A","B","C","D","E","F","G","H","I"];

// นับอุบัติการณ์ของเดือนหนึ่ง -> { "ชื่อรายการ": {A:0,...} }
function rmCount(yearBE, m, back){
  const yCE = (back ? yearBE - 1 : yearBE) - 543;
  const out = {};
  Object.keys(allDays).forEach(key=>{
    const [yy,mm] = key.split("-").map(Number);
    if(yy !== yCE || mm !== m) return;
    const rec = allDays[key];
    SHIFTS.forEach(sh=>{
      const arr = getDeep(rec.shifts[sh], "events.incidents");
      if(!Array.isArray(arr)) return;
      arr.forEach(it=>{
        if(!it || !it.sev) return;
        // ลงที่รายการย่อยถ้ามี ไม่งั้นลงที่หมวด
        const label = (it.item && it.item.trim()) ? it.item : it.group;
        if(!label) return;
        if(!out[label]) out[label] = {};
        out[label][it.sev] = (out[label][it.sev] || 0) + 1;
      });
    });
  });
  return out;
}

// ชื่อในไฟล์ต้นฉบับมีช่องว่าง/จุดปน จึงเทียบแบบตัดช่องว่าง
function rmNorm(s){ return String(s||"").replace(/\s+/g,"").replace(/^[.\-]+/,""); }

// เรียงความบรรยายอุบัติการณ์ 1 รายการ
function rmNarrative(sh, it, incharge){
  const parts = [];
  parts.push(`เวร${sh}`);
  const what = [it.group, it.item].filter(x=>x && String(x).trim()).join(" / ");
  if(what) parts.push(what);
  if(it.sev) parts.push(`ระดับ ${it.sev}`);
  if(it.bed) parts.push(`เตียง ${it.bed}`);
  if(it.hn)  parts.push(`HN ${it.hn}`);
  let s = parts.join(" · ");
  if(it.detail) s += ` — ${it.detail}`;
  if(it.action) s += ` | การแก้ไข: ${it.action}`;
  if(incharge)  s += ` | Incharge: ${incharge}`;
  return s;
}
// ดึงอุบัติการณ์ของเดือนหนึ่ง -> [{date, text}]
function rmMonthIncidents(yearBE, m, back){
  const yCE = (back ? yearBE - 1 : yearBE) - 543;
  const out = [];
  Object.keys(allDays).sort().forEach(key=>{
    const [yy,mm,dd] = key.split("-").map(Number);
    if(yy !== yCE || mm !== m) return;
    SHIFTS.forEach(sh=>{
      const arr = getDeep(allDays[key].shifts[sh], "events.incidents");
      if(!Array.isArray(arr)) return;
      arr.forEach(it=>{
        if(!it || (!it.group && !it.detail)) return;
        out.push({ date:`${dd}/${mm}/${yy+543}`,
                   text: rmNarrative(sh, it, getDeep(allDays[key].shifts[sh],"incharge")) });
      });
    });
  });
  return out;
}

function buildRmSheet(title, counts, auto, incidents){
  const aoa = [];
  RM_TPL.forEach((row,i)=>{
    if(i === 0){ aoa.push([ "", title ]); return; }      // หัวเรื่อง
    if(i === 1){ aoa.push([ "ลำดับ","รายการความเสี่ยง","","Clinic" ]); return; }
    if(i === 2){ aoa.push([ "","","RCU1", ...RM_LEVELS, "รวม" ]); return; }
    const line = [ row.n, row.l ];
    // เติมแถวตัวหารเฉพาะที่ความหมายตรงกันจริง ที่เหลือเว้นว่างให้กรอกเอง
    if(auto){
      const k = rmNorm(row.l);
      if(k === rmNorm("การให้เลือดทั้งหมดของหน่วยงาน(ครั้ง)")){ line.push(auto.blood || ""); aoa.push(line); return; }
      if(k === rmNorm("จำนวนผป  on ETT")){ line.push(auto.vent || ""); aoa.push(line); return; }
      if(k === rmNorm("Vent Day")){ line.push(auto.vent || ""); aoa.push(line); return; }
      if(k === rmNorm("วันนอนรวม")){ line.push(auto.bedDays || ""); aoa.push(line); return; }
    }
    let hit = null;
    const key = rmNorm(row.l);
    if(key){
      for(const k in counts){ if(rmNorm(k) === key){ hit = counts[k]; break; } }
    }
    if(hit){
      line.push("");                                     // คอลัมน์ RCU1
      let sum = 0;
      RM_LEVELS.forEach(L=>{ const v = hit[L] || 0; line.push(v || ""); sum += v; });
      line.push(sum || "");
    }
    aoa.push(line);
  });

  // ---- รายละเอียดอุบัติการณ์ต่อท้ายตาราง ----
  aoa.push([]); aoa.push([]);
  const detailTitleRow = aoa.length;
  aoa.push(["รายละเอียดอุบัติการณ์เดือนนี้"]);
  const detailHeadRow = aoa.length;
  aoa.push(["วันที่","รายละเอียด"]);
  const detailStart = aoa.length;
  const inc = incidents || [];
  if(inc.length) inc.forEach(x=> aoa.push([x.date, x.text]));
  else aoa.push(["", "ไม่มีอุบัติการณ์"]);
  const detailEnd = aoa.length - 1;

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = [{wch:11},{wch:46},{wch:8}].concat(Array(9).fill({wch:5}), [{wch:8}]);
  ws["!freeze"] = {xSplit:2, ySplit:3};
  styleCell(ws,"B1",{font:{bold:true,sz:12,color:{rgb:"0D3B8C"}}});
  ["A2","B2","D2"].forEach(a=>styleCell(ws,a,{font:{bold:true},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center"}}));
  for(let col=2; col<=12; col++){
    styleCell(ws, XLSX.utils.encode_cell({r:2,c:col}),
      {font:{bold:true,color:{rgb:"0D3B8C"}},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center"}});
  }
  RM_TPL.forEach((row,i)=>{
    if(i < 3) return;
    const isHead = String(row.n).trim() !== "" || /^ด้าน|^Med Error/.test(row.l);
    if(isHead){
      for(let col=0; col<=12; col++) styleCell(ws, XLSX.utils.encode_cell({r:i,c:col}),
        {font:{bold:true,color:{rgb:"082A66"}},fill:{fgColor:{rgb:"DDE6F7"}}});
    } else {
      styleCell(ws, XLSX.utils.encode_cell({r:i,c:1}), {alignment:{horizontal:"left",wrapText:true}});
      for(let col=3; col<=11; col++) styleCell(ws, XLSX.utils.encode_cell({r:i,c:col}), {alignment:{horizontal:"center"}});
      styleCell(ws, XLSX.utils.encode_cell({r:i,c:12}),
        {font:{bold:true},fill:{fgColor:{rgb:"FFF4E0"}},alignment:{horizontal:"center"}});
    }
  });

  // ผสานคอลัมน์ B ถึงคอลัมน์สุดท้าย แล้วปรับความสูงแถวตามความยาวข้อความ
  const LAST = 12;
  ws["!merges"] = ws["!merges"] || [];
  ws["!merges"].push({s:{r:detailTitleRow,c:0}, e:{r:detailTitleRow,c:LAST}});
  ws["!merges"].push({s:{r:detailHeadRow,c:1},  e:{r:detailHeadRow,c:LAST}});
  styleCell(ws, XLSX.utils.encode_cell({r:detailTitleRow,c:0}),
    {font:{bold:true,sz:12,color:{rgb:"082A66"}},fill:{fgColor:{rgb:"DDE6F7"}},alignment:{horizontal:"left"}});
  ["A","B"].forEach((_,n)=>styleCell(ws, XLSX.utils.encode_cell({r:detailHeadRow,c:n}),
    {font:{bold:true,color:{rgb:"0D3B8C"}},fill:{fgColor:{rgb:"E8F0FD"}},alignment:{horizontal:"center"}}));

  const rowsMeta = ws["!rows"] || [];
  for(let r=detailStart; r<=detailEnd; r++){
    ws["!merges"].push({s:{r,c:1}, e:{r,c:LAST}});
    styleCell(ws, XLSX.utils.encode_cell({r,c:0}), {alignment:{horizontal:"center",vertical:"top"}});
    styleCell(ws, XLSX.utils.encode_cell({r,c:1}), {alignment:{horizontal:"left",vertical:"top",wrapText:true}});
    const cell = ws[XLSX.utils.encode_cell({r,c:1})];
    const len = cell && cell.v ? String(cell.v).length : 0;
    const perLine = 95;                       // ประมาณอักษรต่อบรรทัดของช่องที่ผสานแล้ว
    rowsMeta[r] = { hpt: Math.max(16, Math.ceil(len / perLine) * 15) };
  }
  ws["!rows"] = rowsMeta;

  return ws;
}
