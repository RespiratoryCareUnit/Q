:root{
  color-scheme:light;
  --ink:#24394D; --navy:#3D7BA8; --soft:#E4F0F8; --paper:#F5F8FA; --card:#FFFFFF; --line:#E3E9EE; --muted:#6B7D8E; --rose:#F4C7C5; --rose-bg:#FDF1F0;
  --out:#B5474B; --ok:#2E8A68; --focus:#2F6FB0; --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:'Sarabun',Tahoma,system-ui,sans-serif;
  font-size:16px; line-height:1.5; color:var(--ink); background:var(--paper);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 90px}

/* ส่วนหัว */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:.01em}
.status{font-size:.8rem;color:var(--muted);white-space:nowrap}
.status.err{color:var(--out)}

.tabs{display:grid;grid-template-columns:1fr 1.25fr 1fr;border:1px solid var(--line);background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.tabs button{border:0;border-left:1px solid var(--line);background:var(--card);padding:11px 4px;line-height:1.25;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--soft);color:var(--navy);box-shadow:inset 0 -3px 0 var(--navy)}

.demo{background:#FFF4DC;border-left:5px solid #D99A1E;padding:9px 12px;margin-bottom:14px;font-size:.88rem;display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:var(--r)}
.demo button{border:1px solid #D99A1E;background:#fff;border-radius:var(--r);padding:4px 10px;font-size:.82rem;cursor:pointer;white-space:nowrap}

/* ป้ายคิว */
.board{background:var(--ub,var(--card));color:var(--ink);border:1px solid var(--uc,var(--line));border-left:8px solid var(--uc,var(--line));border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.board-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(36,57,77,.12);font-size:.9rem;letter-spacing:.04em;color:var(--ink);opacity:.8}
.board-main{display:flex;align-items:stretch}
.bnum{width:92px;color:var(--uc);background:var(--ut);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:3rem;font-weight:700;line-height:1}
.bnum small{font-size:.7rem;font-weight:500;letter-spacing:.08em;margin-top:6px;opacity:.85}
.bname{flex:1;padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-width:0}
.bname b{font-size:calc(2.6rem + 1px);line-height:1.1;font-weight:700;word-break:break-word}
.bname span{font-size:.92rem;color:var(--ink);margin-top:8px;display:flex;align-items:center;gap:8px}
.bname span i{font-style:normal;font-weight:600;background:var(--nb);border:1px solid var(--nc);padding:1px 10px;border-radius:4px}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:18px 2.3em 16px;gap:3px;padding:5px;min-width:0;font-size:.74rem}
.tile .tn{font-size:.72rem;font-weight:600;width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:4px}
.tile .tl{font-weight:500;font-size:1em;line-height:1.15;align-self:start;overflow:hidden}
.tile .tl small{display:block;font-weight:400;color:var(--muted);font-size:1em}
.tile .ts{font-size:.62rem;font-weight:600;text-align:center;border-radius:3px;line-height:16px;height:16px;overflow:hidden;white-space:nowrap}
.tile.next{border-color:var(--uc);box-shadow:inset 0 0 0 1px var(--uc);background:var(--ut)}
.tile.next .ts{color:var(--ink)}
.tile.last .ts{background:#EEF2F5;color:var(--muted)}
.lastline{font-size:.88rem;color:var(--muted);margin:0 0 16px;line-height:1.5}
.lastline b{color:var(--ink);font-weight:500}
.lastline small{display:block;font-size:.72rem;line-height:1.45;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* กล่องทั่วไป */
.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(36,57,77,.04);border-radius:var(--r);padding:14px;margin-bottom:14px}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ptitle h2{font-size:1.02rem;margin:0;font-weight:700}
.ptitle input{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-size:.9rem}

/* ตารางยอด */
.counts{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.counts th,.counts td{border:1px solid var(--line);padding:8px 6px;text-align:center}
.counts th{background:#F7FAFC;font-weight:600;font-size:.85rem}
.counts th small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.counts td:first-child{text-align:left;font-weight:600;white-space:nowrap}
.counts td.z{color:#C3CDD6}
.counts tr.sum td{background:var(--soft);color:var(--ink);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* รายการ */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;text-align:center;min-width:52px}
.row .t small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.row .who{min-width:0}
.row .who b{font-weight:600}
.row .who small{display:block;color:var(--muted);font-size:.82rem}
.tag{display:inline-block;color:var(--ink);font-size:.8rem;font-weight:600;padding:1px 8px;border-radius:3px;margin-right:6px}
.badge{display:inline-block;font-size:.74rem;border:1px solid var(--line);padding:0 7px;border-radius:3px;color:var(--muted);margin:3px 4px 0 0}
.badge.in{border-color:var(--ok);color:var(--ok)}
.badge.out{border-color:var(--out);color:var(--out)}
.row.cancelled{opacity:.5}
.row.cancelled .who b{text-decoration:line-through}
.undo{border:1px solid var(--rose);color:var(--out);background:#fff;border-radius:var(--r);padding:5px 10px;font-size:.82rem;cursor:pointer;align-self:start}
.empty{color:var(--muted);padding:6px 0}

/* ฟอร์ม */
.step{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 6px}
.field{margin-bottom:14px}
.field>label,.field>.lbl{display:block;font-weight:600;margin-bottom:5px}
.field small.h{font-weight:400;color:var(--muted)}
.field small.req{font-weight:600;color:var(--out)}
.field input[type=text],.field input[type=date],.field textarea{font-size:calc(1rem - 1px);width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.shift{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:5px 2px;cursor:pointer;text-align:center;line-height:1.2;font-size:.88rem}
.shift b{font-weight:600}
.shift small{font-size:.68rem;color:var(--muted)}
.shift[aria-pressed="true"]{background:var(--soft);border-color:var(--navy);color:var(--navy)}
.shift[aria-pressed="true"] small{color:var(--navy)}

.wards{display:grid;gap:6px}
.ward{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.ward .wn{width:40px;height:40px;border-radius:4px;color:var(--ink);font-weight:700;font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.ward .wname{font-weight:600;font-size:1.05rem}
.ward .wtag{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:3px}
.ward .wtag.nx{background:#E4F4EC;color:var(--ok)}
.ward .wtag.no{background:#F1F3F5;color:var(--muted)}
.ward[aria-pressed="true"]{border-width:2px}
.ward:disabled{cursor:not-allowed;opacity:.55;background:#F6F8FA}
.ward:disabled .wn{background:#E3E8EC!important;color:var(--muted)}

.effect{border-radius:var(--r);padding:10px 12px;margin-top:10px;font-size:.92rem;background:#EEF8F2;color:#1F5E46;border-left:4px solid #9FD3BA}
.effect.out{background:var(--rose-bg);color:#8E2F33;border-left-color:var(--rose)}
.reasons{margin-top:10px}
.reasons .lbl{display:block;font-weight:600;margin-bottom:6px;color:var(--out)}
.rlist{display:grid;gap:6px}
.reason{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:10px 12px;text-align:left;cursor:pointer}
.reason[aria-pressed="true"]{border-color:var(--out);background:var(--rose-bg);color:#8E2F33;font-weight:600}

.ferr{color:var(--out);font-weight:600;min-height:1.5em;margin:4px 0 8px}
.save{width:100%;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:1.08rem;padding:14px;border-radius:var(--r);cursor:pointer}
.save:disabled{opacity:.55;cursor:wait}

/* กล่องยืนยัน + แจ้งเตือน */
.modal{position:fixed;inset:0;background:rgba(14,34,56,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:var(--card);border-radius:var(--r);width:100%;max-width:380px;overflow:hidden}
.mbox p{margin:0;padding:16px;white-space:pre-line}
.mbox input{display:block;width:calc(100% - 32px);margin:0 16px 14px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mbtns button{border:0;background:#fff;padding:13px;font-weight:600;cursor:pointer}
.mbtns .ok{background:var(--navy);color:#fff}
.mbtns .ok:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#2F4A60;color:#fff;padding:12px 18px;border-radius:var(--r);font-weight:500;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.tabs button:first-child{border-left:0}
/* สถิติ */
.speriod{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.speriod button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:9px;font-weight:600;cursor:pointer}
.speriod button[aria-pressed="true"]{background:var(--soft);border-color:var(--navy);color:var(--navy)}
.snav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px;margin-bottom:14px}
.snav button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);height:44px;font-size:1.2rem;cursor:pointer}
.snav button:disabled{opacity:.4;cursor:default}
.snav b{text-align:center;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 8px;text-align:center}
.kpi b{display:block;font-size:1.9rem;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.in b{color:var(--ok)} .kpi.out b{color:var(--out)}
.kpi.in{background:#F2FAF6;border-color:#D3EDE0}.kpi.out{background:var(--rose-bg);border-color:#F3DAD8}
.bars{display:grid;gap:10px}
.bar-row .bl{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:3px}
.bar-row .bl b{font-weight:600}
.bar-row .bl span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.track2{display:flex;gap:2px;height:12px;background:#F1F4F7;border-radius:6px;overflow:hidden}
.track2 i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.counts td.o{color:var(--out);font-weight:600}
.shiftsum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.shiftsum div{border:1px solid var(--line);border-radius:var(--r);padding:8px}
.shiftsum b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.shiftsum span{font-size:.8rem;color:var(--muted)}
.seed{width:100%;border:1px dashed #E2B866;background:#FFF9EC;color:#8A5B07;border-radius:var(--r);padding:10px;font-weight:600;cursor:pointer;margin-bottom:14px}
.shleg{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:12px}
.shleg i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ctot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);margin-top:14px;padding-top:10px;font-size:.9rem;color:var(--muted)}
.ctot b{font-size:1.5rem;color:var(--ink);font-variant-numeric:tabular-nums}
/* สถิติ: ตัวอักษรเล็กลง */
#view-stats .speriod button{font-size:.86rem;padding:7px}
#view-stats .snav b{font-size:.92rem;font-weight:600}
#view-stats .snav button{height:38px}
#view-stats .kpi{padding:8px 6px}
#view-stats .kpi b{font-size:1.45rem}
#view-stats .kpi span{font-size:.74rem}
#view-stats .panel{padding:12px}
#view-stats .ptitle h2{font-size:.92rem}
#view-queue .counts th,#view-queue .counts td{font-size:calc(1em - 2px)}
#view-queue .counts th{font-size:calc(.85rem - 2px)}
#view-queue .counts th small{font-size:calc(.72rem - 2px)}
#view-stats .bar-row .bl{font-size:.8rem}
#view-stats .bars{gap:8px}
#view-stats .legend{font-size:.72rem}
#view-stats .counts th,#view-stats .counts td{font-size:.8rem;padding:6px 4px}
#view-stats .counts th small{font-size:.66rem}
#view-stats .lastline{font-size:.76rem}
#view-stats .shiftsum b{font-size:1.15rem}
#view-stats .shiftsum span{font-size:.72rem}
#view-stats .row{padding:8px 0}
#view-stats .row .t{font-size:.82rem;min-width:44px}
#view-stats .row .t small{font-size:.7rem}
#view-stats .row .who b{font-size:.84rem}
#view-stats .row .who small{font-size:.74rem}
#view-stats .tag{font-size:.72rem}
#view-stats .seed{font-size:.84rem}
#view-stats .empty{font-size:.85rem}
.qtools{text-align:center;margin:4px 0 8px}
.linkbtn{background:none;border:1px solid var(--line);border-radius:var(--r);padding:8px 14px;color:var(--muted);font-size:.85rem;cursor:pointer}
.mbox select{display:block;width:calc(100% - 32px);margin:0 16px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.exportbtn{width:100%;border:1px solid var(--navy);background:var(--soft);color:var(--navy);border-radius:var(--r);padding:10px;font-weight:600;cursor:pointer;margin-bottom:14px;font-size:.9rem}
.exportbtn:disabled{opacity:.55;cursor:wait}
/* ===== ขนาดตัวอักษรกำหนดเอง ===== */
/* ป้ายคิว */
.tile{font-size:9px}
.tile .tn{font-size:9px;width:16px;height:16px}
.tile .ts{font-size:9.9px}
.lastline{font-size:11px}
.lastline small{font-size:11px}
#view-queue .ptitle h2{font-size:11.6px}
/* บันทึกรับผู้ป่วย: ทั้งหน้าย่อ 0.875 ค่าด้านล่างชดเชยแล้ว ให้ได้ขนาดจริงตามที่กำหนด */
#view-form{zoom:.875}
#view-form .step{font-size:13.26px}
#view-form .field>label,#view-form .field>.lbl{font-size:13.71px}
#view-form .field input[type=text],#view-form .field input[type=date],#view-form .field textarea{font-size:13.71px}
#view-form .shift,#view-form .shift small{font-size:9.14px}
#view-form .ward .wname{font-size:16.00px}
#view-form .ward .wn{font-size:18.29px}
#view-form .ward .wtag{font-size:12.46px}
#view-form .effect{font-size:13.71px}
#view-form .save{font-size:17.26px}
[hidden]{display:none!important}
@media (max-width:380px){.bname b{font-size:calc(2.1rem + 1px)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ระบบรันเตียง MICU</h1>
    <div class="status" id="status"></div>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-queue" aria-selected="true">ป้ายคิว</button>
    <button role="tab" id="tab-form" aria-selected="false">บันทึกรับผู้ป่วย</button>
    <button role="tab" id="tab-stats" aria-selected="false">สถิติ</button>
  </div>

  

  <!-- ===== ป้ายคิว ===== -->
  <section id="view-queue">
    <div class="board" aria-live="polite">
      <div class="board-head"><span>คิวถัดไป</span><span id="b-time"></span></div>
      <div class="board-main">
        <div class="bname"><b id="b-name">…</b><span id="b-after"></span></div>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <p class="lastline" id="lastline"></p>

    <div class="panel">
      <div class="ptitle"><h2>รายการรับ</h2></div>
      <ul class="list" id="list"></ul>
    </div>

    <div class="panel">
      <div class="ptitle">
        <h2>ยอดรับผู้ป่วย</h2>
        <input type="date" id="vdate" aria-label="เลือกวันที่">
      </div>
      <table class="counts" id="counts"></table>
    </div>
    <div class="qtools"><button type="button" class="linkbtn" id="btn-setq">ตั้งคิวถัดไปเอง</button></div>
  </section>

  <!-- ===== บันทึก ===== -->
  <section id="view-form" hidden>
    <div class="panel">
      <p class="step">1. วันและเวร</p>
      <div class="field">
        <input type="date" id="f-date" aria-label="วันที่รับ">
      </div>
      <div class="field">
        <div class="shifts" id="shifts">
          <button type="button" class="shift" data-s="ดึก"><b>ดึก</b> <small>00–08</small></button>
          <button type="button" class="shift" data-s="เช้า"><b>เช้า</b> <small>08–16</small></button>
          <button type="button" class="shift" data-s="บ่าย"><b>บ่าย</b> <small>16–24</small></button>
        </div>
      </div>
    </div>

    <div class="panel">
      <p class="step">2. ข้อมูลผู้ป่วย</p>
      <div class="two">
        <div class="field"><label for="f-hn">HN</label><input type="text" id="f-hn" autocomplete="off"></div>
        <div class="field"><label for="f-an">AN</label><input type="text" id="f-an" autocomplete="off"></div>
      </div>
      <div class="field"><label for="f-name">ชื่อ-สกุล</label><input type="text" id="f-name" autocomplete="off"></div>
      <div class="field" style="margin-bottom:0"><label for="f-info">ข้อมูลผู้ป่วย <small class="h">(ไม่บังคับ เช่น Dx, รับจาก)</small></label><input type="text" id="f-info" autocomplete="off"></div>
    </div>

    <div class="panel">
      <p class="step">3. หอผู้ป่วยที่รับ</p>
      <div class="wards" id="wards"></div>
      <div class="effect" id="effect" hidden></div>
      <div class="reasons" id="reasons" hidden>
        <span class="lbl">เหตุผลที่รับนอกคิว (เลือก 1 ข้อ)</span>
        <div class="rlist" id="rlist"></div>
      </div>
      <div class="field" style="margin:12px 0 0">
        <label for="f-note">หมายเหตุ <small class="h" id="note-req">(ไม่บังคับ)</small></label>
        <textarea id="f-note"></textarea>
      </div>
    </div>

    <div class="panel">
      <p class="step">4. ผู้บันทึก</p>
      <div class="field" style="margin-bottom:0"><input type="text" id="f-by" placeholder="ชื่อผู้บันทึก" autocomplete="off" aria-label="ชื่อผู้บันทึก"></div>
    </div>

    <div class="ferr" id="ferr" role="alert"></div>
    <button class="save" id="btn-save">บันทึกการรับ</button>
  </section>

  <!-- ===== สถิติ ===== -->
  <section id="view-stats" hidden>
    <div class="speriod" id="speriod">
      <button type="button" data-p="week">รายสัปดาห์</button>
      <button type="button" data-p="month">รายเดือน</button>
    </div>
    <div class="snav">
      <button type="button" id="s-prev" aria-label="ช่วงก่อนหน้า">‹</button>
      <b id="s-label"></b>
      <button type="button" id="s-next" aria-label="ช่วงถัดไป">›</button>
    </div>
    <button class="exportbtn" id="btn-export">ดาวน์โหลดไฟล์ Excel ช่วงนี้</button>
    <button class="seed" id="btn-seed" hidden>เติมข้อมูลตัวอย่าง 30 วัน เพื่อลองดูสถิติ</button>
    <div id="s-body"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="modal" id="qmodal" hidden role="dialog" aria-modal="true" aria-labelledby="q-title">
  <div class="mbox">
    <p><b id="q-title">ตั้งคิวถัดไป</b><br><small style="color:var(--muted)">ใช้ตอนเริ่มใช้ระบบ หรือแก้คิวที่ผิด ไม่นับเป็นการรับผู้ป่วย</small></p>
    <select id="q-unit" aria-label="หอที่จะเป็นคิวถัดไป"></select>
    <input type="text" id="q-note" placeholder="เหตุผล เช่น เริ่มใช้ระบบ ต่อจากสมุด" autocomplete="off">
    <input type="text" id="q-by" placeholder="ชื่อผู้บันทึก" autocomplete="off">
    <p class="ferr" id="q-err" style="padding:0 16px;margin:0 0 8px;min-height:0"></p>
    <div class="mbtns"><button id="q-cancel">ยกเลิก</button><button class="ok" id="q-ok">ตั้งคิว</button></div>
  </div>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true">
  <div class="mbox">
    <p id="m-text"></p>
    <input type="text" id="m-input" autocomplete="off">
    <div class="mbtns">
      <button id="m-cancel">ยกเลิก</button>
      <button class="ok" id="m-ok">ตกลง</button>
    </div>
  </div>
</div>

<script>
/* ========= ใส่ URL ของ Web App (Apps Script) ตรงนี้ ========= */
const API_URL = 'วาง_URL_WEB_APP_ที่นี่';

const UCOL = ['#BCD6EE', '#D8CAEC', '#BDE3DB', '#F5DCB9', '#D2E4BB']; // สีพาสเทลประจำหอ
const UDARK = ['#5E92C2', '#9077BD', '#4E9F91', '#C9964D', '#7D9B55']; // สีเส้นขอบ
const SHIFT_ORDER = ['ดึก', 'เช้า', 'บ่าย'];
const SH_TIME = { 'ดึก': '00–08', 'เช้า': '08–16', 'บ่าย': '16–24' };
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let D = null, vdate = null, chosen = null, shift = null, reason = null, busy = false;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idx = u => D.units.indexOf(u);
const col = u => UCOL[Math.max(0, idx(u))];
const nextAfter = u => D.units[(idx(u) + 1) % D.units.length];
function split2(u){ const p = u.split(' '); return p.length > 1 ? [p.slice(0, -1).join(' '), p[p.length - 1]] : [u, '']; }

function today(){ const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function shiftNow(){ const h = new Date().getHours(); return h < 8 ? 'ดึก' : h < 16 ? 'เช้า' : 'บ่าย'; }
function thDate(s){ const [y,m,d] = s.split('-').map(Number); return `${d} ${TH_M[m-1]} ${y+543}`; }
function setStatus(t, err){ const el = $('#status'); el.textContent = t; el.classList.toggle('err', !!err); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3500); }

/* ===== แกนระบบคิว (ชุดเดียวกันทั้งใน index.html และ Code.gs) ===== */
var Q = {
  state: function (units, rows) {
    var next = units[0], last = null;
    rows.forEach(function (r) {
      if (r.status !== 'active') return;
      if (r.type === 'ตั้งคิว') next = r.unit;
      else { last = r; next = units[(units.indexOf(r.unit) + 1) % units.length]; }
    });
    return { next: next, last: last };
  },
  snapshot: function (units, reasons, rows, date, now) {
    var st = Q.state(units, rows), l = st.last;
    return {
      units: units, reasons: reasons, date: date,
      next: { unit: st.next, after: units[(units.indexOf(st.next) + 1) % units.length] },
      last: l ? { id: l.id, unit: l.unit, type: l.type, date: l.date, shift: l.shift, by: l.by, created: l.created } : null,
      list: rows.filter(function (r) { return r.date === date && r.type !== 'ตั้งคิว'; }),
      serverTime: now
    };
  },
  range: function (rows, from, to) {
    return rows.filter(function (r) { return r.type !== 'ตั้งคิว' && r.date >= from && r.date <= to; });
  },
  admit: function (units, reasons, rows, d, now, id) {
    var st = Q.state(units, rows), t = function (v) { return String(v == null ? '' : v).trim(); };
    if (d.expected && d.expected !== st.next) throw new Error('QUEUE_CHANGED');
    if (units.indexOf(d.unit) < 0) throw new Error('ไม่พบหอผู้ป่วยนี้');
    if (st.last && st.last.unit === d.unit) throw new Error(d.unit + ' เพิ่งรับรายล่าสุด ห้ามรับติดกัน');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t(d.date))) throw new Error('กรุณาเลือกวันที่รับ');
    if (['ดึก', 'เช้า', 'บ่าย'].indexOf(d.shift) < 0) throw new Error('กรุณาเลือกเวร');
    if (!t(d.hn) && !t(d.an)) throw new Error('กรุณากรอก HN หรือ AN');
    if (!t(d.by)) throw new Error('กรุณากรอกชื่อผู้บันทึก');
    var type = 'ตามคิว', reason = '';
    if (d.unit !== st.next) {
      type = 'นอกคิว'; reason = t(d.reason);
      if (reasons.indexOf(reason) < 0) throw new Error('รับนอกคิว กรุณาเลือกเหตุผล');
      if (t(d.note).length < 3) throw new Error('รับนอกคิว กรุณาระบุรายละเอียดเหตุผลในหมายเหตุ');
    }
    return { id: id, created: now, date: t(d.date), shift: d.shift, hn: t(d.hn), an: t(d.an), name: t(d.name),
      info: t(d.info), unit: d.unit, type: type, expected: st.next, reason: reason, note: t(d.note), by: t(d.by),
      status: 'active', cancelledBy: '', cancelledAt: '' };
  },
  undo: function (units, rows, id, by) {
    var st = Q.state(units, rows);
    if (!st.last || st.last.id !== id) throw new Error('มีรายการใหม่กว่านี้แล้ว กรุณารีเฟรช');
    if (!String(by || '').trim()) throw new Error('กรุณากรอกชื่อผู้ยกเลิก');
    return st.last;
  },
  setNext: function (units, rows, d, now, id) {
    var st = Q.state(units, rows), by = String(d.by || '').trim(), note = String(d.note || '').trim();
    if (units.indexOf(d.unit) < 0) throw new Error('ไม่พบหอผู้ป่วยนี้');
    if (st.last && st.last.unit === d.unit) throw new Error(d.unit + ' เพิ่งรับรายล่าสุด ตั้งเป็นคิวถัดไปไม่ได้');
    if (!note) throw new Error('กรุณาระบุเหตุผลที่ตั้งคิว');
    if (!by) throw new Error('กรุณากรอกชื่อผู้บันทึก');
    return { id: id, created: now, date: now.slice(0, 10), shift: '', hn: '', an: '', name: '', info: '',
      unit: d.unit, type: 'ตั้งคิว', expected: st.next, reason: '', note: note, by: by,
      status: 'active', cancelledBy: '', cancelledAt: '' };
  }
};

/* ---------- โหมดทดลอง (ใช้เมื่อยังไม่ใส่ API_URL) ---------- */
const DEMO = !API_URL.startsWith('http');
const DEMO_UNITS = ['RCU1', 'MICU2 Lt.1', 'RCU2', 'MICU2 Lt.2', 'MICU 7Lt'];
const DEMO_REASONS = ['หอผู้ป่วยที่ถึงคิวไม่มีเตียงว่าง', 'แพทย์ระบุหอผู้ป่วย', 'ผู้ป่วยเดิมของหอผู้ป่วย (Re-admit)',
  'เครื่องช่วยหายใจ/อุปกรณ์ไม่พอ', 'อื่น ๆ'];
const DKEY = 'micu-demo-v4';
let memDB = null;
function demoDB(){
  try { const v = JSON.parse(localStorage.getItem(DKEY)); if (v && v.rows) return v; } catch (e) {}
  return memDB || { rows: [] };
}
function demoSave(db){ memDB = db; try { localStorage.setItem(DKEY, JSON.stringify(db)); } catch (e) {} }
function demoNow(){ const d = new Date(); return `${today()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const newId = () => Math.random().toString(36).slice(2, 10);
function demoApi(action, b){
  const db = demoDB(), U = DEMO_UNITS, R = DEMO_REASONS, now = demoNow();
  try {
    if (action === 'range') return { ok: true, data: { units: U, rows: Q.range(db.rows, b.from, b.to) } };
    if (action === 'admit') {
      const row = Q.admit(U, R, db.rows, b.data || {}, now, newId());
      db.rows.push(row); demoSave(db);
      return { ok: true, saved: { id: row.id, unit: row.unit, type: row.type }, data: Q.snapshot(U, R, db.rows, row.date, now) };
    }
    if (action === 'undoLast') {
      const r = Q.undo(U, db.rows, b.id, b.by);
      r.status = 'cancelled'; r.cancelledBy = String(b.by).trim(); r.cancelledAt = now; demoSave(db);
    }
    if (action === 'setNext') { db.rows.push(Q.setNext(U, db.rows, b, now, newId())); demoSave(db); }
    return { ok: true, data: Q.snapshot(U, R, db.rows, b.date, now) };
  } catch (e) {
    return { ok: false, error: e.message, data: Q.snapshot(U, R, db.rows, b.date, now) };
  }
}

/* ---------- กล่องยืนยัน ---------- */
function askDialog(text, nameLabel){
  return new Promise(resolve => {
    const m = $('#modal'), inp = $('#m-input'), ok = $('#m-ok'), cancel = $('#m-cancel');
    $('#m-text').textContent = text;
    inp.hidden = !nameLabel; inp.value = ''; inp.placeholder = nameLabel || '';
    ok.disabled = !!nameLabel;
    inp.oninput = () => { ok.disabled = !inp.value.trim(); };
    const done = v => { m.hidden = true; ok.onclick = cancel.onclick = null; resolve(v); };
    ok.onclick = () => done(nameLabel ? inp.value.trim() : true);
    cancel.onclick = () => done(null);
    m.hidden = false;
    (nameLabel ? inp : ok).focus();
  });
}

/* ---------- เชื่อมต่อ ---------- */
async function load(quiet){
  if (DEMO) { D = demoApi('get', { date: vdate }).data; render(); setStatus(''); return; }
  if (busy) return;
  busy = true;
  if (!quiet) setStatus('กำลังโหลด…');
  try {
    const r = await fetch(`${API_URL}?action=get&date=${encodeURIComponent(vdate)}&t=${Date.now()}`);
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    D = j.data; render();
    setStatus('อัปเดต ' + D.serverTime.slice(11, 16) + ' น.');
  } catch (e) {
    setStatus('โหลดไม่สำเร็จ', true);
  } finally { busy = false; }
}

async function post(action, body){
  busy = true;
  try {
    let j;
    if (DEMO) j = demoApi(action, { date: vdate, ...body });
    else {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, date: vdate, ...body }) });
      j = await r.json();
    }
    if (!j.ok) {
      if (j.data) { D = j.data; render(); }
      throw new Error(j.error === 'QUEUE_CHANGED'
        ? 'คิวเปลี่ยนแล้ว มีผู้บันทึกก่อนหน้า ระบบอัปเดตคิวให้แล้ว กรุณาตรวจสอบแล้วกดบันทึกอีกครั้ง' : j.error);
    }
    D = j.data; vdate = D.date; $('#vdate').value = vdate; render();
    setStatus(DEMO ? '' : 'อัปเดต ' + D.serverTime.slice(11, 16) + ' น.');
    return j;
  } finally { busy = false; }
}

  const bd = document.querySelector('.board'); bd.style.setProperty('--uc', UDARK[idx(nx)]); bd.style.setProperty('--ub', UCOL[idx(nx)]);
  const ai = idx(D.next.after); bd.style.setProperty('--nb', UCOL[ai]); bd.style.setProperty('--nc', UDARK[ai]); bd.style.setProperty('--ut', c + '1A');

  $('#b-time').textContent = D.serverTime.slice(11, 16) + ' น.';
  $('#tiles').innerHTML = D.units.map((u, i) => {
    const isN = u === nx, isL = u === lastU, [a, b] = split2(u);
    const st = isN ? 'ถัดไป' : isL ? 'รับล่าสุด' : '';

const SHCOL = { 'ดึก': '#7FA7CC', 'เช้า': '#BCD6EE', 'บ่าย': '#9DBFE0' };
function renderCounts(){
  const c = {}; D.units.forEach(u => { c[u] = {}; SHIFT_ORDER.forEach(s => c[u][s] = 0); });
  D.list.filter(r => r.status === 'active' && c[r.unit]).forEach(r => { if (c[r.unit][r.shift] !== undefined) c[r.unit][r.shift]++; });
  const tot = {}; SHIFT_ORDER.forEach(s => tot[s] = D.units.reduce((a, u) => a + c[u][s], 0));
  const all = SHIFT_ORDER.reduce((a, s) => a + tot[s], 0);
  const cell = v => `<td class="${v ? '' : 'z'}">${v}</td>`;
  $('#counts').innerHTML = `
    <tr><th>หอผู้ป่วย</th>${SHIFT_ORDER.map(x => `<th>${x}<small>${SH_TIME[x]}</small></th>`).join('')}<th>รวม</th></tr>
    ${D.units.map(u => {
      const sum = SHIFT_ORDER.reduce((a, s) => a + c[u][s], 0);
      return `<tr><td><i class="dot" style="background:${col(u)}"></i>${esc(u)}</td>${SHIFT_ORDER.map(s => cell(c[u][s])).join('')}${cell(sum)}</tr>`;
    }).join('')}
    <tr class="sum"><td>รวม</td>${SHIFT_ORDER.map(s => `<td>${tot[s]}</td>`).join('')}<td>${all}</td></tr>`;
}

function renderList(){
  const rows = [...D.list].sort((a, b) => b.created.localeCompare(a.created));
  if (!rows.length) { $('#list').innerHTML = `<li class="empty">ยังไม่มีการรับผู้ป่วยในวันนี้</li>`; return; }
  $('#list').innerHTML = rows.map(r => {
    const cancelled = r.status !== 'active';
    const canUndo = !cancelled && D.last && r.id === D.last.id;
    return `<li class="row ${cancelled ? 'cancelled' : ''}">
      <span class="t">${esc(r.created.slice(11, 16))}<small>เวร${esc(r.shift)}</small></span>
      <div class="who">
        <span class="tag" style="background:${col(r.unit)}">${esc(r.unit)}</span><b>${esc(r.name || '(ไม่ระบุชื่อ)')}</b>
        <small>HN ${esc(r.hn || '-')} AN ${esc(r.an || '-')}${r.info ? `, ${esc(r.info)}` : ''}</small>
        <span class="badge ${r.type === 'นอกคิว' ? 'out' : 'in'}">${esc(r.type)}</span>${cancelled ? `<span class="badge out">ยกเลิกโดย ${esc(r.cancelledBy)}</span>` : ''}
        ${r.reason ? `<small>เหตุผล: ${esc(r.reason)}${r.note ? `, ${esc(r.note)}` : ''}</small>` : (r.note ? `<small>หมายเหตุ: ${esc(r.note)}</small>` : '')}
        <small>บันทึกโดย ${esc(r.by)}</small>
      </div>
      ${canUndo ? `<button class="undo" data-id="${esc(r.id)}">ยกเลิก</button>` : '<span></span>'}
    </li>`;
  }).join('');
}

/* ---------- ฟอร์ม ---------- */
function effect(u){
  if (u === D.next.unit) return { type: 'ตามคิว', text: `ตามคิว หลังบันทึก คิวถัดไปจะเป็น ${nextAfter(u)}` };
  return { type: 'นอกคิว', text: `นอกคิว: ตอนนี้ถึงคิว ${D.next.unit} ถ้ารับเข้า ${u} แทน ${D.next.unit} จะเสียรอบนี้ และคิวถัดไปจะเป็น ${nextAfter(u)}` };
}

function renderShifts(){ document.querySelectorAll('.shift').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === shift)); }

function renderWards(){
  const lastU = D.last ? D.last.unit : null;
  if (chosen && chosen === lastU) chosen = null;
  $('#wards').innerHTML = D.units.map((u, i) => {
    const on = chosen === u, blocked = u === lastU;
    const tag = blocked ? '<span class="wtag no">เพิ่งรับล่าสุด</span>' : u === D.next.unit ? '<span class="wtag nx">คิวถัดไป</span>' : '<span></span>';
    return `<button type="button" class="ward" data-u="${esc(u)}" aria-pressed="${on}" ${blocked ? 'disabled' : ''}
      style="${on ? `border-color:${UDARK[i]};background:${UCOL[i]}40` : ''}">
      <span class="wn" style="background:${UCOL[i]}">${i + 1}</span><span class="wname">${esc(u)}</span>${tag}</button>`;
  }).join('');
}

function renderEffect(){
  const el = $('#effect'), nr = $('#note-req');
  if (!chosen || !D) { el.hidden = true; $('#reasons').hidden = true; nr.textContent = '(ไม่บังคับ)'; nr.className = 'h'; return; }
  const ef = effect(chosen), out = ef.type === 'นอกคิว';
  el.hidden = false; el.textContent = ef.text; el.classList.toggle('out', out);
  $('#reasons').hidden = !out;
  if (!out) reason = null;
  $('#rlist').innerHTML = D.reasons.map(r =>
    `<button type="button" class="reason" aria-pressed="${reason === r}" data-r="${esc(r)}">${esc(r)}</button>`).join('');
  nr.textContent = out ? '(จำเป็น: ระบุเหตุผล)' : '(ไม่บังคับ)';
  nr.className = out ? 'req' : 'h';
}

function resetForm(){
  ['#f-hn', '#f-an', '#f-name', '#f-info', '#f-note', '#f-date'].forEach(s => $(s).value = '');
  chosen = null; shift = null; reason = null; $('#ferr').textContent = '';
}

async function save(){
  const ferr = $('#ferr'); ferr.textContent = '';
  if (!D) { ferr.textContent = 'ยังโหลดข้อมูลคิวไม่สำเร็จ กรุณารีเฟรช'; return; }
  const date = $('#f-date').value, hn = $('#f-hn').value.trim(), an = $('#f-an').value.trim();
  const note = $('#f-note').value.trim(), by = $('#f-by').value.trim();
  if (!date) { ferr.textContent = 'กรุณาเลือกวันที่รับ'; $('#f-date').focus(); return; }
  if (!shift) { ferr.textContent = 'กรุณาเลือกเวร'; return; }
  if (!hn && !an) { ferr.textContent = 'กรุณากรอก HN หรือ AN'; $('#f-hn').focus(); return; }
  if (!chosen) { ferr.textContent = 'กรุณาเลือกหอผู้ป่วยที่รับ'; return; }
  const ef = effect(chosen);
  if (ef.type === 'นอกคิว' && !reason) { ferr.textContent = 'รับนอกคิว กรุณาเลือกเหตุผล'; return; }
  if (ef.type === 'นอกคิว' && note.length < 3) { ferr.textContent = 'รับนอกคิว กรุณาระบุรายละเอียดเหตุผลในหมายเหตุ'; $('#f-note').focus(); return; }
  if (!by) { ferr.textContent = 'กรุณากรอกชื่อผู้บันทึก'; $('#f-by').focus(); return; }
  if (!(await askDialog(`ยืนยันรับเข้า ${chosen}\nเวร${shift} ${thDate(date)}\n\n${ef.text}`))) return;

  const btn = $('#btn-save'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    vdate = date;
    const j = await post('admit', { data: { date, shift, hn, an, name: $('#f-name').value.trim(),
      info: $('#f-info').value.trim(), unit: chosen, expected: D.next.unit, reason: ef.type === 'นอกคิว' ? reason : '', note, by } });
    try { localStorage.setItem('micu-by', by); } catch (e) {}
    toast(`บันทึกแล้ว: ${j.saved.unit} (${j.saved.type})`);
    resetForm(); show('queue');
  } catch (e) {
    ferr.textContent = 'บันทึกไม่สำเร็จ: ' + e.message;
  } finally { btn.disabled = false; btn.textContent = 'บันทึกการรับ'; }
}

/* ---------- ดาวน์โหลด Excel ---------- */
function loadExcelJS(){
  if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((ok, bad) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload = () => ok(window.ExcelJS); sc.onerror = () => bad(new Error('โหลดตัวสร้าง Excel ไม่สำเร็จ'));
    document.head.appendChild(sc);
  });
}
function saveBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
/* ---------- สร้างไฟล์ Excel แบบจัดรูปแบบ ---------- */
function buildWorkbook(ExcelJS, units, rows, range){
  const UC = ['BCD6EE', 'D8CAEC', 'BDE3DB', 'F5DCB9', 'D2E4BB'];
  const C = { ink: 'FF24394D', muted: 'FF6B7D8E', head: 'FFE4F0F8', line: 'FFD5DEE6', soft: 'FFF5F8FA',
    rose: 'FFFDF1F0', roseT: 'FFB5474B', ok: 'FF2E8A68', title: 'FF3D7BA8' };
  const F = 'Tahoma';
  const fill = c => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: c } });
  const thin = { style: 'thin', color: { argb: C.line } };
  const box = { top: thin, left: thin, bottom: thin, right: thin };
  const ufill = u => fill('FF' + UC[Math.max(0, units.indexOf(u)) % UC.length]);
  const period = `${thDate(range.from)} ถึง ${thDate(range.to)}`;
  const d = new Date(), stamp = `${thDate(today())} เวลา ${pad(d.getHours())}:${pad(d.getMinutes())} น.`;

  const wb = new ExcelJS.Workbook();
  wb.creator = 'ระบบรันเตียง MICU';

  function header(ws, title, ncol){
    ws.mergeCells(1, 1, 1, ncol); ws.mergeCells(2, 1, 2, ncol);
    const t = ws.getCell(1, 1); t.value = title;
    t.font = { name: F, size: 14, bold: true, color: { argb: C.title } };
    t.alignment = { vertical: 'middle' }; ws.getRow(1).height = 26;
    const s = ws.getCell(2, 1); s.value = `ช่วงวันที่ ${period}   ออกรายงานเมื่อ ${stamp}`;
    s.font = { name: F, size: 9, color: { argb: C.muted } };
  }
  function headRow(ws, r, labels){
    const row = ws.getRow(r); row.values = labels; row.height = 30;
    row.eachCell(c => { c.font = { name: F, size: 10, bold: true, color: { argb: C.ink } }; c.fill = fill(C.head);
      c.border = box; c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; });
  }

  /* ชีต 1: รายการรับ */
  const ws = wb.addWorksheet('รายการรับ', { views: [{ state: 'frozen', ySplit: 4, showGridLines: false }],
    pageSetup: { orientation: 'landscape', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      margins: { left: .4, right: .4, top: .5, bottom: .5, header: .3, footer: .3 } } });
  const cols = [['ลำดับ', 6], ['วันที่รับ', 13], ['เวร', 7], ['เวลา', 7], ['หอผู้ป่วย', 13], ['ประเภท', 9],
    ['คิวที่ถึง', 13], ['เหตุผลนอกคิว', 26], ['หมายเหตุ', 24], ['HN', 11], ['AN', 11], ['ชื่อ-สกุล', 22],
    ['ข้อมูลผู้ป่วย', 22], ['ผู้บันทึก', 14], ['สถานะ', 12]];
  ws.columns = cols.map(([, w]) => ({ width: w }));
  header(ws, 'รายการรับผู้ป่วย ระบบรันเตียง MICU', cols.length);
  headRow(ws, 4, cols.map(c => c[0]));
  const list = [...rows].sort((a, b) => a.created.localeCompare(b.created));
  list.forEach((r, i) => {
    const cancelled = r.status !== 'active', out = r.type === 'นอกคิว';
    const row = ws.addRow([i + 1, thDate(r.date), r.shift, r.created.slice(11, 16), r.unit, r.type, r.expected || '',
      r.reason || '', r.note || '', r.hn || '', r.an || '', r.name || '', r.info || '', r.by || '',
      cancelled ? `ยกเลิก (${r.cancelledBy || '-'})` : 'ปกติ']);
    row.eachCell({ includeEmpty: true }, (c, n) => {
      c.font = { name: F, size: 10, color: { argb: cancelled ? C.muted : C.ink }, strike: cancelled && n !== 15 };
      c.border = box;
      c.alignment = { vertical: 'top', wrapText: n === 8 || n === 9 || n === 13, horizontal: [1, 3, 4, 6].includes(n) ? 'center' : 'left' };
      if (i % 2) c.fill = fill(C.soft);
    });
    ['J', 'K'].forEach(k => { row.getCell(k).numFmt = '@'; });
    if (!cancelled) row.getCell(5).fill = ufill(r.unit);
    if (out && !cancelled) { const c = row.getCell(6); c.fill = fill(C.rose); c.font = { name: F, size: 10, bold: true, color: { argb: C.roseT } }; }
    if (!out && !cancelled) row.getCell(6).font = { name: F, size: 10, color: { argb: C.ok } };
  });
  ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4, column: cols.length } };
  ws.headerFooter.oddFooter = '&L&8ระบบรันเตียง MICU&R&8หน้า &P / &N';

  /* ชีต 2: สรุป */
  const act = rows.filter(r => r.status === 'active');
  const ss = wb.addWorksheet('สรุป', { views: [{ showGridLines: false }],
    pageSetup: { orientation: 'portrait', paperSize: 9, fitToPage: true, fitToWidth: 1, fitToHeight: 0 } });
  ss.columns = [{ width: 30 }, ...Array(7).fill({ width: 11 })];
  header(ss, 'สรุปการรับผู้ป่วย ระบบรันเตียง MICU', 8);

  const total = act.length, outN = act.filter(r => r.type === 'นอกคิว').length, inN = total - outN;
  const pct = n => total ? n / total : 0;
  const kpi = [['รับทั้งหมด', total, null, C.head, C.ink], ['ตามคิว', inN, pct(inN), 'FFF2FAF6', C.ok], ['นอกคิว', outN, pct(outN), C.rose, C.roseT]];
  kpi.forEach(([lab, n, p, bg, fg], i) => {
    const r = 4 + i, a = ss.getCell(r, 1), b = ss.getCell(r, 2), c = ss.getCell(r, 3);
    a.value = lab; b.value = n; c.value = p;
    [a, b, c].forEach(x => { x.fill = fill(bg); x.border = box; x.font = { name: F, size: 11, bold: x !== a, color: { argb: fg } };
      x.alignment = { vertical: 'middle', horizontal: x === a ? 'left' : 'center' }; });
    c.numFmt = '0%'; if (p === null) c.value = '';
    ss.getRow(r).height = 22;
  });

  let r0 = 8;
  ss.getCell(r0, 1).value = 'แยกตามหอผู้ป่วย'; ss.getCell(r0, 1).font = { name: F, size: 11, bold: true, color: { argb: C.title } };
  const sh = SHIFT_ORDER;
  headRow(ss, r0 + 1, ['หอผู้ป่วย', 'รับทั้งหมด', 'ตามคิว', 'นอกคิว', 'ถูกข้าม', ...sh.map(x => 'เวร' + x)]);
  units.forEach((u, i) => {
    const m = act.filter(r => r.unit === u);
    const row = ss.getRow(r0 + 2 + i);
    row.values = [u, m.length, m.filter(r => r.type === 'ตามคิว').length, m.filter(r => r.type === 'นอกคิว').length,
      act.filter(r => r.type === 'นอกคิว' && r.expected === u).length, ...sh.map(x => m.filter(r => r.shift === x).length)];
    row.eachCell((c, n) => { c.border = box; c.font = { name: F, size: 10, color: { argb: (n === 4 || n === 5) && c.value ? C.roseT : C.ink } };
      c.alignment = { horizontal: n === 1 ? 'left' : 'center', vertical: 'middle' }; });
    row.getCell(1).fill = ufill(u); row.height = 20;
  });
  const tr = ss.getRow(r0 + 2 + units.length), a1 = r0 + 2, a2 = r0 + 1 + units.length;
  tr.getCell(1).value = 'รวม';
  for (let n = 2; n <= 8; n++) {
    const L = String.fromCharCode(64 + n);
    let v = 0; for (let k = a1; k <= a2; k++) v += Number(ss.getCell(k, n).value) || 0;
    tr.getCell(n).value = { formula: `SUM(${L}${a1}:${L}${a2})`, result: v };
  }
  tr.eachCell(c => { c.border = box; c.fill = fill(C.head); c.font = { name: F, size: 10, bold: true, color: { argb: C.ink } };
    c.alignment = { horizontal: c.col === 1 ? 'left' : 'center', vertical: 'middle' }; });
  tr.height = 22;
  ss.getCell(r0 + 3 + units.length, 1).value = 'ถูกข้าม คือ ถึงคิวหอนั้น แต่ผู้ป่วยไปรับที่หออื่น';
  ss.getCell(r0 + 3 + units.length, 1).font = { name: F, size: 9, italic: true, color: { argb: C.muted } };

  const reasons = {};
  act.filter(r => r.type === 'นอกคิว').forEach(r => { const k = r.reason || 'ไม่ระบุ'; reasons[k] = (reasons[k] || 0) + 1; });
  const rs = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  if (rs.length) {
    const r1 = r0 + 5 + units.length;
    ss.getCell(r1, 1).value = 'เหตุผลที่รับนอกคิว'; ss.getCell(r1, 1).font = { name: F, size: 11, bold: true, color: { argb: C.title } };
    headRow(ss, r1 + 1, ['เหตุผล', 'จำนวนครั้ง', 'สัดส่วน']);
    rs.forEach(([k, v], i) => {
      const row = ss.getRow(r1 + 2 + i); row.values = [k, v, v / outN];
      row.eachCell((c, n) => { c.border = box; c.font = { name: F, size: 10, color: { argb: C.ink } };
        c.alignment = { horizontal: n === 1 ? 'left' : 'center', vertical: 'middle', wrapText: n === 1 }; });
      row.getCell(3).numFmt = '0%';
    });
  }
  return wb;
}

function exportTables(units, rows){
  const list = [...rows].sort((a, b) => a.created.localeCompare(b.created)).map(r => ({
    'วันที่รับ': thDate(r.date), 'เวร': r.shift, 'เวลาบันทึก': r.created.slice(11, 16), 'หอผู้ป่วย': r.unit,
    'ประเภท': r.type, 'คิวที่ถึงตอนนั้น': r.expected || '', 'เหตุผลนอกคิว': r.reason || '', 'หมายเหตุ': r.note || '',
    'HN': r.hn || '', 'AN': r.an || '', 'ชื่อ-สกุล': r.name || '', 'ข้อมูลผู้ป่วย': r.info || '',
    'ผู้บันทึก': r.by || '', 'สถานะ': r.status === 'active' ? 'ปกติ' : 'ยกเลิก', 'ยกเลิกโดย': r.cancelledBy || ''
  }));
  const act = rows.filter(r => r.status === 'active');
  const sum = units.map(u => {
    const m = act.filter(r => r.unit === u), o = { 'หอผู้ป่วย': u, 'รับทั้งหมด': m.length,
      'ตามคิว': m.filter(r => r.type === 'ตามคิว').length, 'นอกคิว': m.filter(r => r.type === 'นอกคิว').length,
      'ถูกข้าม': act.filter(r => r.type === 'นอกคิว' && r.expected === u).length };
    SHIFT_ORDER.forEach(x => o['เวร' + x] = m.filter(r => r.shift === x).length);
    return o;
  });
  const tot = { 'หอผู้ป่วย': 'รวม' };
  Object.keys(sum[0] || {}).slice(1).forEach(k => tot[k] = sum.reduce((a, o) => a + o[k], 0));
  return { list, sum: sum.concat([tot]) };
}
async function exportExcel(){
  if (!sData) return;
  const btn = $('#btn-export'), { units, rows, range } = sData;
  if (!rows.length) { toast('ไม่มีข้อมูลในช่วงนี้'); return; }
  const name = `รันเตียง-MICU_${range.from}_ถึง_${range.to}`;
  const { list } = exportTables(units, rows);
  btn.disabled = true; btn.textContent = 'กำลังสร้างไฟล์…';
  try {
    const EJ = await loadExcelJS();
    const buf = await buildWorkbook(EJ, units, rows, range).xlsx.writeBuffer();
    saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name + '.xlsx');
    toast('ดาวน์โหลดไฟล์แล้ว');
  } catch (e) {
    // สำรอง: ไฟล์ CSV เปิดด้วย Excel ได้
    const keys = Object.keys(list[0]), q = v => `"${String(v).replace(/"/g, '""')}"`;
    const csv = '\uFEFF' + [keys.map(q).join(',')].concat(list.map(o => keys.map(k => q(o[k])).join(','))).join('\r\n');
    saveBlob(new Blob([csv], { type: 'text/csv;charset=utf-8' }), name + '.csv');
    toast('ดาวน์โหลดเป็นไฟล์ CSV แล้ว');
  } finally { btn.disabled = false; btn.textContent = 'ดาวน์โหลดไฟล์ Excel ช่วงนี้'; }
}
function addDays(s, n){ const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d + n);
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }
function sRange(){
  const [y, m, d] = sAnchor.split('-').map(Number);
  if (sPeriod === 'week') {
    const from = addDays(sAnchor, -((new Date(y, m - 1, d).getDay() + 6) % 7)); // เริ่มวันจันทร์
    return { from, to: addDays(from, 6) };
  }
  return { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(new Date(y, m, 0).getDate())}` };
}
function sLabel(r){
  if (sPeriod === 'month') { const [y, m] = r.from.split('-').map(Number); return `${TH_M[m - 1]} ${y + 543}`; }
  const [, m1, d1] = r.from.split('-').map(Number);
  return `${d1}${r.from.slice(0, 7) === r.to.slice(0, 7) ? '' : ' ' + TH_M[m1 - 1]} – ${thDate(r.to)}`;
}
async function fetchRange(from, to){
  if (DEMO) return demoApi('range', { from, to }).data;
  const r = await fetch(`${API_URL}?action=range&from=${from}&to=${to}&t=${Date.now()}`);
  const j = await r.json(); if (!j.ok) throw new Error(j.error);
  return { units: j.data.units || (D && D.units) || DEMO_UNITS, rows: j.data.rows || [] };
}
async function loadStats(){
  if (!sAnchor) sAnchor = today();
  const r = sRange();
  document.querySelectorAll('#speriod button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === sPeriod));
  $('#s-label').textContent = sLabel(r);
  $('#s-next').disabled = r.to >= today();
  $('#btn-seed').hidden = !DEMO;
  $('#s-body').innerHTML = '<p class="empty">กำลังโหลด…</p>';
  try { const res = await fetchRange(r.from, r.to); sData = { units: res.units, rows: res.rows, range: r }; renderStats(res.units, res.rows); }
  catch (e) { $('#s-body').innerHTML = `<p class="empty" style="color:var(--out)">โหลดสถิติไม่สำเร็จ: ${esc(e.message)}</p>`; }
}
function renderStats(units, rows){
  const act = rows.filter(r => r.status === 'active');
  if (!act.length) { $('#s-body').innerHTML = '<div class="panel"><p class="empty">ไม่มีการรับผู้ป่วยในช่วงนี้</p></div>'; return; }
  const ucol = u => UCOL[Math.max(0, units.indexOf(u))];
  const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
  const per = {}; units.forEach(u => per[u] = { all: 0, inq: 0, out: 0, skip: 0 });
  const rs = {}, sh = { 'เช้า': 0, 'บ่าย': 0, 'ดึก': 0 };
  const us = {}; units.forEach(u => { us[u] = {}; SHIFT_ORDER.forEach(x => us[u][x] = 0); });
  act.forEach(r => {
    const p = per[r.unit]; if (!p) return;
    p.all++; r.type === 'นอกคิว' ? p.out++ : p.inq++;
    if (sh[r.shift] !== undefined) { sh[r.shift]++; us[r.unit][r.shift]++; }
    if (r.type === 'นอกคิว') {
      const k = r.reason || 'ไม่ระบุ'; rs[k] = (rs[k] || 0) + 1;
      const exp = r.expected || (r.before !== undefined && r.before !== '' ? units[Number(r.before)] : null);
      if (exp && per[exp]) per[exp].skip++;
    }
  });
  const total = act.length, out = act.filter(r => r.type === 'นอกคิว').length, inq = total - out;
  const max = Math.max(...units.map(u => per[u].all), 1);
  const outRows = act.filter(r => r.type === 'นอกคิว').sort((a, b) => b.created.localeCompare(a.created));
  const hatch = '#EFA9A6';

  $('#s-body').innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${total}</b><span>รับทั้งหมด</span></div>
      <div class="kpi in"><b>${inq}</b><span>ตามคิว ${pct(inq, total)}%</span></div>
      <div class="kpi out"><b>${out}</b><span>นอกคิว ${pct(out, total)}%</span></div>
    </div>

    <div class="panel">
      <div class="ptitle"><h2>จำนวนรับ แยกหอผู้ป่วย</h2></div>
      <div class="bars">${units.map(u => { const p = per[u]; return `
        <div class="bar-row">
          <div class="bl"><b><i class="dot" style="background:${ucol(u)}"></i>${esc(u)}</b><span>${p.all} ราย${p.out ? ` (นอกคิว ${p.out})` : ''}</span></div>
          <div class="track2"><i style="width:${p.inq / max * 100}%;background:${ucol(u)}"></i><i style="width:${p.out / max * 100}%;background:${hatch}"></i></div>
        </div>`; }).join('')}</div>
      <div class="legend"><span><i style="background:#C9D6E2"></i>ตามคิว (สีประจำหอ)</span><span><i style="background:${hatch}"></i>นอกคิว</span></div>
    </div>

    <div class="panel">
      <div class="ptitle"><h2>ตารางสรุป</h2></div>
      <table class="counts">
        <tr><th>หอผู้ป่วย</th><th>รับ</th><th>ตามคิว</th><th>นอกคิว</th><th>ถูกข้าม<small>เสียรอบ</small></th></tr>
        ${units.map(u => { const p = per[u]; const c = (v, k) => `<td class="${v ? k : 'z'}">${v}</td>`;
          return `<tr><td><i class="dot" style="background:${ucol(u)}"></i>${esc(u)}</td>${c(p.all, '')}${c(p.inq, '')}${c(p.out, 'o')}${c(p.skip, 'o')}</tr>`; }).join('')}
        <tr class="sum"><td>รวม</td><td>${total}</td><td>${inq}</td><td>${out}</td><td>${units.reduce((a, u) => a + per[u].skip, 0)}</td></tr>
      </table>
      <p class="lastline" style="margin:8px 0 0">ถูกข้าม คือ ถึงคิวหอนั้น แต่ผู้ป่วยไปรับที่หออื่น</p>
    </div>

    ${out ? `<div class="panel">
      <div class="ptitle"><h2>เหตุผลที่รับนอกคิว</h2></div>
      <div class="bars">${Object.entries(rs).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
        <div class="bar-row"><div class="bl"><b>${esc(k)}</b><span>${v} ครั้ง</span></div>
        <div class="track2"><i style="width:${v / out * 100}%;background:#EFA9A6"></i></div></div>`).join('')}</div>
    </div>` : ''}

    <div class="panel">
      <div class="ptitle"><h2>ยอดรับ แยกหอผู้ป่วยและเวร</h2></div>
      <div class="shiftsum" style="margin-bottom:14px">${SHIFT_ORDER.map(s => `<div style="background:${SHCOL[s]}33;border-color:${SHCOL[s]}"><b>${sh[s]}</b><span>เวร${s}</span></div>`).join('')}</div>
      <div class="bars">${units.map(u => { const n = per[u].all;
        const det = SHIFT_ORDER.filter(x => us[u][x]).map(x => `${x} ${us[u][x]}`).join(', ');
        return `<div class="bar-row">
          <div class="bl"><b><i class="dot" style="background:${ucol(u)}"></i>${esc(u)}</b><span>${n ? `${n} ราย (${det})` : '–'}</span></div>
          <div class="track2">${SHIFT_ORDER.map(x => us[u][x] ? `<i style="width:${us[u][x] / max * 100}%;background:${SHCOL[x]}"></i>` : '').join('')}</div>
        </div>`; }).join('')}</div>
      <div class="legend">${SHIFT_ORDER.map(x => `<span><i style="background:${SHCOL[x]}"></i>เวร${x}</span>`).join('')}</div>
    </div>

    ${out ? `<div class="panel">
      <div class="ptitle"><h2>รายการนอกคิว (${out})</h2></div>
      <ul class="list">${outRows.map(r => `<li class="row" style="grid-template-columns:auto 1fr">
        <span class="t">${esc(thDate(r.date).replace(/ \d+$/, ''))}<small>เวร${esc(r.shift)}</small></span>
        <div class="who"><span class="tag" style="background:${ucol(r.unit)}">${esc(r.unit)}</span><b>${esc(r.reason || '-')}</b>
          ${r.note ? `<small>${esc(r.note)}</small>` : ''}<small>บันทึกโดย ${esc(r.by)}</small></div></li>`).join('')}</ul>
    </div>` : ''}`;
}
function demoSeed(){
  const U = DEMO_UNITS, R = DEMO_REASONS, db = { rows: [] };
  for (let k = 29; k >= 0; k--) {
    const date = addDays(today(), -k), n = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const st = Q.state(U, db.rows); let unit = st.next, reason = '', note = '';
      if (Math.random() < 0.18) {
        const opts = U.filter(u => u !== st.next && (!st.last || u !== st.last.unit));
        unit = opts[Math.floor(Math.random() * opts.length)];
        reason = R[Math.floor(Math.random() * 4)]; note = 'ข้อมูลตัวอย่าง';
      }
      const hh = Math.min(23, i * 5 + Math.floor(Math.random() * 4));
      db.rows.push(Q.admit(U, R, db.rows, { date, shift: hh < 8 ? 'ดึก' : hh < 16 ? 'เช้า' : 'บ่าย',
        hn: String(1000000 + Math.floor(Math.random() * 8999999)), unit, reason, note, by: 'ตัวอย่าง' },
        `${date} ${pad(hh)}:${pad(Math.floor(Math.random() * 60))}:00`, newId()));
    }
  }
  demoSave(db);
}

/* ---------- สลับหน้า ---------- */
function show(v){
  ['queue', 'form', 'stats'].forEach(k => {
    $('#view-' + k).hidden = v !== k; $('#tab-' + k).setAttribute('aria-selected', v === k);
  });
  if (v === 'stats') loadStats();
  if (v === 'form') {
    if (!$('#f-date').value) $('#f-date').value = today();
    if (!shift) shift = shiftNow();
    if (!chosen && D) chosen = D.next.unit;
    renderShifts(); if (D) { renderWards(); renderEffect(); }
  }
  window.scrollTo(0, 0);
}

/* ---------- เหตุการณ์ ---------- */
$('#tab-queue').onclick = () => show('queue');
$('#tab-form').onclick = () => show('form');
$('#tab-stats').onclick = () => show('stats');
$('#vdate').onchange = e => { if (e.target.value) { vdate = e.target.value; load(); } };
$('#btn-save').onclick = save;
$('#shifts').onclick = e => { const b = e.target.closest('.shift'); if (!b) return; shift = b.dataset.s; renderShifts(); };
$('#wards').onclick = e => { const b = e.target.closest('.ward'); if (!b || b.disabled) return; chosen = b.dataset.u; renderWards(); renderEffect(); };
$('#rlist').onclick = e => { const b = e.target.closest('.reason'); if (!b) return; reason = b.dataset.r; renderEffect(); };
$('#list').onclick = async e => {
  const b = e.target.closest('.undo'); if (!b) return;
  const by = await askDialog('ยกเลิกรายการนี้และคืนคิวกลับเหมือนเดิม', 'ชื่อผู้ยกเลิก');
  if (!by) return;
  try { await post('undoLast', { id: b.dataset.id, by }); toast('ยกเลิกรายการแล้ว'); }
  catch (err) { toast('ยกเลิกไม่สำเร็จ: ' + err.message); }
};
$('#speriod').onclick = e => { const b = e.target.closest('button'); if (!b) return; sPeriod = b.dataset.p; loadStats(); };
$('#btn-export').onclick = exportExcel;
$('#s-prev').onclick = () => { const r = sRange(); sAnchor = addDays(r.from, -1); loadStats(); };
$('#s-next').onclick = () => { const r = sRange(); sAnchor = addDays(r.to, 1); loadStats(); };
$('#btn-seed').onclick = async () => {
  if (!(await askDialog('เติมข้อมูลตัวอย่าง 30 วัน?\nข้อมูลทดลองเดิมจะถูกแทนที่'))) return;
  demoSeed(); load(); loadStats(); toast('เติมข้อมูลตัวอย่างแล้ว');
};
$('#btn-setq').onclick = () => {
  if (!D) return;
  const lastU = D.last ? D.last.unit : null;
  $('#q-unit').innerHTML = D.units.map(u => `<option ${u === lastU ? 'disabled' : ''} ${u === D.next.unit ? 'selected' : ''}>${esc(u)}</option>`).join('');
  $('#q-note').value = ''; $('#q-err').textContent = '';
  try { $('#q-by').value = localStorage.getItem('micu-by') || ''; } catch (e) {}
  $('#qmodal').hidden = false;
};
$('#q-cancel').onclick = () => { $('#qmodal').hidden = true; };
$('#q-ok').onclick = async () => {
  const unit = $('#q-unit').value, note = $('#q-note').value.trim(), by = $('#q-by').value.trim();
  if (!note) { $('#q-err').textContent = 'กรุณาระบุเหตุผล'; return; }
  if (!by) { $('#q-err').textContent = 'กรุณากรอกชื่อผู้บันทึก'; return; }
  $('#q-ok').disabled = true;
  try { await post('setNext', { unit, note, by }); $('#qmodal').hidden = true; toast(`ตั้งคิวถัดไปเป็น ${unit} แล้ว`); }
  catch (e) { $('#q-err').textContent = e.message; }
  finally { $('#q-ok').disabled = false; }
};


/* ---------- เริ่มต้น ---------- */
vdate = today(); $('#vdate').value = vdate;
try { $('#f-by').value = localStorage.getItem('micu-by') || ''; } catch (e) {}
load();
setInterval(() => { if (document.visibilityState === 'visible') load(true); }, 30000);

/* ---------- แอปบนมือถือ ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
